<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hatari AI 产品项目详情。">
<title>Project — Hatari's AI Workspace</title>
<link rel="stylesheet" href="subpages.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in shell">
    <a class="mark" href="preview.html" aria-label="返回首页"><i></i><span>Hatari&rsquo;s AI Workspace</span></a>
    <div class="hdr-right">
      <nav class="hdr-nav" aria-label="主导航">
        <a href="projects.html" aria-current="page">Projects</a>
        <a href="thinking.html">Thinking</a>
        <a href="stack.html">Stack</a>
        <span aria-disabled="true">About</span>
      </nav>
      <button class="icon-btn" id="theme" aria-label="切换深色模式">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="detail-shell">
    <a class="detail-back" href="projects.html"><span aria-hidden="true">←</span> All projects</a>

    <section class="detail-hero" aria-labelledby="project-title">
      <div class="detail-copy">
        <p class="eyebrow" id="project-kicker">AI product</p>
        <h1 id="project-title">Loading project...</h1>
        <p id="project-summary"></p>
        <div class="detail-status"><i aria-hidden="true"></i><span id="project-status"></span></div>
      </div>
      <div class="detail-visual" id="project-visual" aria-label="项目界面概念预览"></div>
    </section>

    <section class="detail-facts" aria-label="项目概况" id="project-facts"></section>

    <section class="detail-sections" aria-label="项目详情">
      <article class="detail-section"><span>Problem</span><h2>What needed changing</h2><p id="project-problem"></p></article>
      <article class="detail-section"><span>System</span><h2>How it works</h2><p id="project-system"></p></article>
      <article class="detail-section"><span>Next</span><h2>What I&rsquo;m testing</h2><p id="project-next"></p></article>
    </section>

    <div class="detail-progress">
      <div class="detail-progress-head"><span>Build progress</span><span id="project-progress-label"></span></div>
      <div class="detail-progress-track"><i id="project-progress"></i></div>
    </div>
  </div>
</main>

<footer class="ftr">
  <div class="ftr-in shell">
    <p><span>&copy; 2026 Hatari</span><span aria-hidden="true">&middot;</span><span>Building useful things for humans with AI.</span></p>
    <ul class="socials">
      <li><a href="https://github.com/Hatari130" target="_blank" rel="noreferrer" aria-label="GitHub"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.8c-2.7.6-3.3-1.3-3.3-1.3-.4-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.4-1.1.7-1.4-2.2-.2-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.2-.4-1.2.1-2.6 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.6.6.7 1 1.6 1 2.7 0 3.8-2.3 4.7-4.5 4.9.5.4.8 1.1.8 2.2v2.7c0 .3.2.6.8.5A9.8 9.8 0 0 0 12 2.2Z"/></svg></a></li>
    </ul>
  </div>
</footer>

<script>
(function(){
  var PROJECTS = {
    "viral-hunter":{
      title:"Viral Hunter", kicker:"Content intelligence", status:"Live beta · monitoring signals", progress:78,
      summary:"从内容样本中发现增长信号，归纳传播结构，并把洞察转成可执行的选题与创作建议。",
      facts:[["Role","Product + AI"],["Stage","Live beta"],["Year","2026"],["Focus","Signal discovery"]],
      problem:"创作者通常能看到结果，却很难知道内容为什么传播。传统报表展示数字，却没有把模式翻译成下一步行动。",
      system:"Research Agent 持续采集样本，Analyst Agent 比较结构、节奏和反馈信号，最后生成带证据的机会简报。",
      next:"继续测试小样本下的可靠性、跨平台信号归一化，以及建议是否真正提高创作决策速度。",
      visual:"viral"
    },
    "agent-workspace":{
      title:"Agent Workspace", kicker:"Multi-agent operations", status:"Building · 3 agents online", progress:80,
      summary:"一个可观察的多 Agent 协作空间，让任务拆分、工具调用、上下文和执行状态一眼可见。",
      facts:[["Role","Product + System"],["Stage","Building"],["Year","2026"],["Focus","Agent harness"]],
      problem:"Agent 一旦进入长任务，用户很容易失去方向感：不知道它正在做什么、卡在哪里，以及该何时介入。",
      system:"工作区把规划、执行、验证和人工确认拆成可见节点，并保存每次工具调用、产物和恢复点。",
      next:"正在验证多 Agent 交接、失败恢复和权限边界，让自主性增加时仍然保持足够的可控性。",
      visual:"agent"
    },
    "ai-content-studio":{
      title:"AI Content Studio", kicker:"Creator workflow", status:"Building · private preview", progress:65,
      summary:"把研究、提纲、写作与多平台改写收进同一条内容工作流，减少上下文来回切换。",
      facts:[["Role","Product design"],["Stage","Building"],["Year","2026"],["Focus","Creative flow"]],
      problem:"内容工作散落在搜索、文档、聊天和发布工具之间。真正耗时的往往不是写作，而是反复搬运上下文。",
      system:"Studio 将来源、创作意图和版本历史放进同一上下文，由不同 Agent 负责研究、结构与渠道适配。",
      next:"重点测试长文一致性、编辑者控制感，以及 AI 建议在什么时候出现最自然。",
      visual:"studio"
    },
    "urban-ai":{
      title:"Urban AI", kicker:"Spatial intelligence", status:"Research · mapping opportunities", progress:42,
      summary:"探索空间数据、城市感知与生成式 AI 的结合方式，把复杂信息变成可理解的决策线索。",
      facts:[["Role","Research"],["Stage","Exploration"],["Year","2025"],["Focus","Spatial AI"]],
      problem:"城市数据维度很多，但对普通决策者来说往往过于专业、分散，也缺少能解释变化原因的交互方式。",
      system:"把空间指标、时间变化与自然语言查询连接起来，让用户能从地图中的异常继续追问原因和影响。",
      next:"目前聚焦数据可信度、空间尺度变化和解释层，避免生成式界面给出看似合理但无法追溯的结论。",
      visual:"urban"
    }
  };

  function visual(type,title){
    var top = '<div class="mock-topbar"><i></i><i></i><i></i><b>'+title+'</b></div>';
    if (type === "viral") {
      return '<div class="project-shot shot-viral"><div class="shot-window">'+top+'<div class="dashboard"><aside class="dash-nav"><span class="dash-brand"></span><i></i><i></i><i></i><i></i></aside><div class="dash-main"><div class="mock-title"></div><div class="metric-row"><span><b></b><i></i></span><span><b></b><i></i></span><span><b></b><i></i></span></div><div class="bar-chart"><i style="height:30%"></i><i style="height:46%"></i><i style="height:38%"></i><i style="height:68%"></i><i style="height:57%"></i><i style="height:82%"></i><i style="height:72%"></i><i style="height:91%"></i></div></div></div></div></div>';
    }
    if (type === "agent") {
      return '<div class="project-shot shot-agent"><div class="shot-window">'+top+'<div class="agent-canvas"><span class="connector connector-a"></span><span class="connector connector-b"></span><span class="connector connector-c"></span><span class="node node-a"></span><span class="node node-b"></span><span class="node node-c"></span><span class="node node-d"></span></div></div></div>';
    }
    if (type === "studio") {
      return '<div class="project-shot shot-studio"><div class="shot-window">'+top+'<div class="studio-layout"><aside class="studio-side"><b></b><i></i><i></i><i></i><i></i></aside><div class="studio-doc"><h3></h3><p></p><p></p><p></p><p></p></div><aside class="studio-tool"><i></i><i></i><i></i></aside></div></div></div>';
    }
    return '<div class="project-shot shot-urban"><div class="shot-window">'+top+'<div class="urban-layout"><div class="map-grid"><i></i><i></i><i></i><i></i></div><aside class="urban-panel"><b></b><i></i><i></i><i></i><i></i></aside></div></div></div>';
  }

  var slug = new URLSearchParams(window.location.search).get("project") || "agent-workspace";
  var project = PROJECTS[slug] || PROJECTS["agent-workspace"];
  document.title = project.title+" — Hatari's AI Workspace";
  document.getElementById("project-kicker").textContent = project.kicker;
  document.getElementById("project-title").textContent = project.title;
  document.getElementById("project-summary").textContent = project.summary;
  document.getElementById("project-status").textContent = project.status;
  document.getElementById("project-visual").innerHTML = visual(project.visual,project.title);
  document.getElementById("project-problem").textContent = project.problem;
  document.getElementById("project-system").textContent = project.system;
  document.getElementById("project-next").textContent = project.next;
  document.getElementById("project-progress-label").textContent = project.progress+"%";
  document.getElementById("project-progress").style.setProperty("--progress",project.progress+"%");
  document.getElementById("project-facts").innerHTML = project.facts.map(function(fact){
    return '<div class="detail-fact"><span>'+fact[0]+'</span><b>'+fact[1]+'</b></div>';
  }).join("");

  var btn = document.getElementById("theme");
  var dark = false;
  var sun = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"/></svg>';
  var moon = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></svg>';
  btn.addEventListener("click",function(){
    dark = !dark;
    document.documentElement.classList.toggle("dark",dark);
    btn.innerHTML = dark ? moon : sun;
    btn.setAttribute("aria-label",dark ? "切换到浅色模式" : "切换到深色模式");
  });
})();
</script>
</body>
</html>
