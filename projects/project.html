  function renderProjectLinks(language){
    var links = project.links || [];
    if (!links.length && (project.website || project.repo)) {
      links = [{
        kind:project.website ? "website" : "github",
        href:project.website || project.repo,
        label:project.website ? "在线体验" : "GitHub 源码",
        labelEn:project.website ? "Live website" : "GitHub repository"
      }];
    }
    var linkGroup = document.getElementById("project-links");
    linkGroup.replaceChildren();
    linkGroup.hidden = links.length === 0;
    linkGroup.setAttribute("aria-label",language === "en" ? "Project links" : "项目外部链接");
    links.forEach(function(link){
      var label = language === "en" ? link.labelEn : link.label;
      var anchor = document.createElement("a");
      anchor.className = "detail-link detail-link--"+link.kind;
      anchor.href = link.href;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.setAttribute("aria-label",label+(language === "en" ? " (opens in a new tab)" : "（在新标签页打开）"));
      anchor.innerHTML = linkIcon(link.kind)+"<span></span>";
      anchor.querySelector("span").textContent = label;
      linkGroup.appendChild(anchor);
    });
  }
  function renderProject(language){
    var copy = language === "en" && project.en ? project.en : project;
    var projectTitle = language === "en" && project.titleEn ? project.titleEn : project.title;
    document.title = projectTitle+" — "+(language === "en" ? "Hatari's AI Workspace" : "Hatari 的 AI 工作台");
    document.getElementById("project-kicker").textContent = copy.kicker;
    document.getElementById("project-title").textContent = projectTitle;
    document.getElementById("project-summary").textContent = copy.summary;
    document.getElementById("project-status").textContent = copy.status;
    renderProjectLinks(language);
    document.getElementById("project-visual").innerHTML = visual(project.visual);
    document.getElementById("project-problem").textContent = copy.problem;
    document.getElementById("project-system").textContent = copy.system;
    document.getElementById("project-next").textContent = copy.next;
    document.getElementById("project-progress-label").textContent = project.progress+"%";
    document.getElementById("project-progress").style.setProperty("--progress",project.progress+"%");
    document.getElementById("project-facts").innerHTML = copy.facts.map(function(fact){
      return '<div class="detail-fact"><span>'+fact[0]+'</span><b>'+fact[1]+'</b></div>';
    }).join("");
  }
  renderProject(window.HATARI_LANG || "zh");
  document.addEventListener("hatari:languagechange",function(event){
    renderProject(event.detail && event.detail.lang === "en" ? "en" : "zh");
  });
  var btn = document.getElementById("theme");
  var dark = false;
  var sun = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"/></svg>';
  var moon = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></svg>';
  btn.addEventListener("click",function(){
    dark = !dark;
    document.documentElement.classList.toggle("dark",dark);
    btn.innerHTML = dark ? moon : sun;
    btn.setAttribute("aria-label",dark ? "切换到浅色模式" : "切换到深色模式");
  });
})();
