<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatari's AI Workspace — 预览</title>
<link rel="stylesheet" href="shared/site.css">
<script src="shared/site.js"></script>
<script>
document.documentElement.classList.add("js-typing");
try {
  if (window.localStorage.getItem("hatari.theme.v1") === "dark") {
    document.documentElement.classList.add("dark");
  }
} catch (err) {}
if (/[?&]motion=reduce\b/.test(location.search)) {
  document.documentElement.classList.add("reduce-motion");
} else if (!/[?&]motion=system\b/.test(location.search)) {
  document.documentElement.classList.add("force-motion");
}
</script>
<style>
/* ============================================================
   Tokens — 与 Next.js 项目 app/globals.css 一致
   ============================================================ */
:root{
  --paper:#f5f4f1;
  --paper-2:#efeeea;
  --surface:#fdfdfc;
  --ink:#161614;
  --ink-2:#6d6b66;
  --ink-3:#a3a09a;
  --copy-en:#77746f;
  --copy-zh:#88857f;
  --copy-note:#96938d;
  --line:#e2e0da;
  --grid:rgba(22,22,20,.026);
  --scroll-title:0px;
  --scroll-lede:0px;
  --scroll-copy:0px;
  --scroll-detail:0px;
  --scroll-workspace:0px;
  --desk-top:#c9c8c3;
  --desk-edge:#aaa9a4;
  --desk-line:rgba(42,41,37,.16);
  --lamp-body:#252521;
  --lamp-metal:#4b4a44;
  --lamp-light:#f2cc72;
  --lamp-beam:rgba(244,207,126,.17);
  --plant-leaf:#667e61;
  --plant-leaf-2:#8a9a78;
  --plant-pot:#b8b3a8;

  --ff-display:"Arial Nova","Aptos Display","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ff-sans:Aptos,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ff-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
html{color-scheme:light}
html.dark{
  --paper:#131312; --paper-2:#191917; --surface:#1f1f1c;
  --ink:#ecebe6; --ink-2:#9b9891; --ink-3:#706d67; --line:#2b2a26;
  --copy-en:#aaa7a0; --copy-zh:#9c9992; --copy-note:#85827b;
  --grid:rgba(236,235,230,.025);
  --desk-top:#282925;
  --desk-edge:#181916;
  --desk-line:rgba(255,255,255,.08);
  --lamp-body:#11120f;
  --lamp-metal:#33342f;
  --lamp-light:#5d594d;
  --lamp-beam:rgba(244,207,126,0);
  --plant-leaf:#455747;
  --plant-leaf-2:#65735b;
  --plant-pot:#52534e;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper); color:var(--ink);
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;
  background-position:-1px -1px;
  font-family:var(--ff-sans); font-size:16px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background-color .52s cubic-bezier(.22,1,.36,1),color .52s cubic-bezier(.22,1,.36,1);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
::selection{background:color-mix(in oklab,var(--ink) 16%,transparent)}
:focus-visible{outline:2px solid color-mix(in oklab,var(--ink) 55%,transparent);outline-offset:2px}
.mono{font-family:var(--ff-mono)}
.shell{max-width:1440px;margin:0 auto}

/* ============================================================
   Header
   ============================================================ */
.hdr{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid color-mix(in oklab,var(--line) 70%,transparent);
  background:color-mix(in oklab,var(--paper) 80%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:opacity .58s cubic-bezier(.22,1,.36,1),
             translate .58s cubic-bezier(.22,1,.36,1),background-color .52s,border-color .52s;
}
.hdr-in{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative}
.mark{display:flex;align-items:center;gap:12px}
.mark i{width:10px;height:10px;border-radius:99px;background:var(--ink)}
.mark span{font-family:var(--ff-mono);font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}
html[data-lang="zh"] .mark span{font-family:var(--ff-sans);font-weight:500;letter-spacing:.08em}
.hdr-nav{
  position:absolute;left:50%;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:2px;padding:3px;
  border:1px solid color-mix(in oklab,var(--line) 82%,transparent);border-radius:8px;
  background:color-mix(in oklab,var(--paper) 72%,transparent);
  box-shadow:0 1px 2px color-mix(in oklab,var(--ink) 7%,transparent);
  transition:background-color .25s,border-color .25s,box-shadow .25s;
}
.hdr-nav a,.hdr-nav span{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  min-width:54px;height:30px;padding:0 12px;border-radius:5px;
  font-size:.78rem;letter-spacing:0;color:var(--ink-2);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .2s,color .2s,scale .16s;
}
.hdr-nav a:hover{
  background:color-mix(in oklab,var(--ink) 5%,transparent);color:var(--ink)
}
.hdr-nav a:focus-visible{outline:2px solid color-mix(in oklab,var(--ink) 45%,transparent);outline-offset:2px}
.hdr-nav a:active{scale:.96}
.hdr-nav a[aria-current="page"]{
  background:var(--ink);color:var(--paper);
  box-shadow:inset 0 -1px 0 color-mix(in oklab,var(--paper) 20%,transparent)
}
.hdr-nav span{opacity:.58;cursor:default}
.hdr-right{display:flex;align-items:center;gap:24px;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:99px;display:grid;place-items:center;
  color:var(--ink-2);-webkit-tap-highlight-color:transparent;
  transition:background-color .25s,color .25s,scale .16s;
}
.icon-btn:hover{background:color-mix(in oklab,var(--ink) 5%,transparent);color:var(--ink)}
.icon-btn:active{scale:.96}
@media (max-width:720px){
  .hdr-in{padding:0 20px}
  .hdr-right{gap:10px}
  .hdr-nav{position:static;transform:none;gap:1px;padding:2px}
  .hdr-nav a,.hdr-nav span{min-width:0;height:28px;padding:0 7px;font-size:.7rem}
}
@media (max-width:460px){.mark span{display:none}}

/* ============================================================
   Split layout
   ============================================================ */
.split{
  position:relative;
  display:grid;grid-template-columns:1fr;gap:56px;
  padding:32px 24px 80px;align-items:center;
}
.split>*{min-width:0}
@media (min-width:1024px){
  .split{
    --scene-bridge:clamp(90px,7.2vw,132px);
    --scene-feather:clamp(132px,10vw,184px);
    grid-template-columns:minmax(0,42fr) minmax(0,58fr);
    gap:0;
    padding:28px clamp(52px,4.5vw,72px) 96px 40px;
    align-items:start;
  }
  .intro-column{position:relative;z-index:7}
}

/* ---------------- left column ---------------- */
.intro-column{
  transition:opacity .62s cubic-bezier(.22,1,.36,1),translate .62s cubic-bezier(.22,1,.36,1);
}
.intro{max-width:460px}
.identity-group,.capability-group,.action-group{min-width:0}
.capability-group{margin-top:52px}
.action-group{margin-top:48px}
.intro h1{
  margin:0;font-family:var(--ff-display);
  font-size:2.72rem;font-weight:700;
  line-height:.98;letter-spacing:0;white-space:nowrap;
  transform:translate3d(0,var(--scroll-title),0);
}
.typed > .title-perch{display:inline-block;opacity:1}
@media (min-width:1024px){.intro h1{font-size:3.4rem}}
@media (min-width:1440px){.intro h1{font-size:4rem}}
@media (max-width:460px){.intro h1{font-size:2.4rem}}
@media (max-width:360px){.intro h1{font-size:2rem}}
.lede{
  width:max-content;max-width:100%;margin:20px 0 0;font-family:var(--ff-sans);
  font-size:.94rem;font-weight:400;line-height:1.68;letter-spacing:0;white-space:nowrap;
  color:var(--copy-en);
  transform:translate3d(0,var(--scroll-lede),0);
}
.intro-zh{
  margin:20px 0 0;font-size:.82rem;line-height:1.72;
  color:var(--copy-zh);
  transform:translate3d(0,var(--scroll-copy),0);
}

/* ---------- cinematic typewriter ----------
   Characters are laid out in full from the first frame and revealed by
   opacity, never by growing a string — the hero box therefore never reflows
   while typing, which is the whole difference between "premium" and "janky".
   `visibility` keeps the block hidden until the split is done, and the
   scripting: none / reduced-motion rules make sure the text is simply there
   when the animation can't or shouldn't run. */
.js-typing .typed{visibility:hidden}
.typed{position:relative}
.typed > span{opacity:0;transition:opacity .09s ease-out}
.typed > span.on{opacity:1}

.hero-caret{
  position:absolute;left:0;top:0;width:2px;border-radius:1px;
  background:var(--ink);opacity:0;pointer-events:none;
  transition:left .07s linear,opacity .45s ease;
}
.hero-caret.show{opacity:1}
/* Real carets blink hard and stop while you type. A soft ease-in-out blink,
   held solid during typing, is the calmer reading. */
.hero-caret.blink{animation:caretSoft 1.15s ease-in-out infinite}
.hero-caret.fade{opacity:0;transition:opacity .9s cubic-bezier(.22,1,.36,1)}
@keyframes caretSoft{0%,100%{opacity:1}50%{opacity:.12}}

.js-typing .stage{opacity:0;translate:0 12px}
.stage{transition:opacity .75s cubic-bezier(.16,1,.3,1),translate .75s cubic-bezier(.16,1,.3,1)}
.stage.in{opacity:1;translate:0 0}
.stage-explore,.stage-progress{transform:translate3d(0,var(--scroll-detail),0)}

.ui-stage{
  transition:opacity 1s cubic-bezier(.16,1,.3,1),
             translate 1s cubic-bezier(.16,1,.3,1),
             filter 1.1s cubic-bezier(.16,1,.3,1);
}
.js-typing .ui-stage{opacity:0;filter:blur(6px)}
.js-typing .ui-stage-header{translate:0 -8px}
.js-typing .ui-stage-workspace{translate:0 10px}
.ui-stage-workspace{transform:translate3d(0,var(--scroll-workspace),0)}
.ui-stage.in{opacity:1;translate:0 0;filter:blur(0)}

@media (scripting: none){
  .typed{visibility:visible!important}
  .typed > span{opacity:1!important}
  .hero-caret{display:none}
  .stage{opacity:1!important;translate:0 0!important}
  .ui-stage{opacity:1!important;translate:0 0!important;filter:none!important}
}
@media (prefers-reduced-motion:reduce){
  html:not(.force-motion) .hero-caret,
  html:not(.force-motion) .term-body .caret{display:none}
}
html.reduce-motion .hero-caret,
html.reduce-motion .term-body .caret{display:none}

.rule-head{display:flex;align-items:center;gap:16px;margin-top:0}
.rule-head h2{
  margin:0;font-family:var(--ff-sans);font-size:.75rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);
}
.rule-head i{flex:1;height:1px;background:var(--line)}

.explore{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.explore li{display:flex;align-items:center;gap:12px;font-size:.875rem;letter-spacing:0;color:color-mix(in oklab,var(--ink) 85%,transparent)}
.explore b{
  width:13px;height:13px;border-radius:99px;display:grid;place-items:center;
  border:1px solid color-mix(in oklab,var(--ink) 18%,transparent);
}
.explore b::after{content:"";width:3.5px;height:3.5px;border-radius:99px;background:color-mix(in oklab,var(--ink) 35%,transparent)}

.build{
  margin-top:0;padding:18px;border-radius:8px;
  border:1px solid var(--line);
  background:color-mix(in oklab,var(--surface) 60%,transparent);
  box-shadow:0 1px 2px color-mix(in oklab,var(--ink) 6%,transparent);
}
.build-hd{display:flex;align-items:center;gap:8px}
.build-hd h2{margin:0;font-size:.8rem;font-weight:500;letter-spacing:0;color:color-mix(in oklab,var(--ink) 85%,transparent)}
.build ul{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.build li{display:flex;align-items:center;gap:10px}
.sq{
  width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  background:var(--ink);color:rgba(255,255,255,.9);
}
.build .nm{flex:1;min-width:0;font-size:.8rem;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:color-mix(in oklab,var(--ink) 85%,transparent)}
.meter{width:96px;flex:0 0 auto}
.meter em{display:block;text-align:right;font-family:var(--ff-mono);font-size:.62rem;font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-3);margin-bottom:4px}
.meter span{display:block;height:2px;border-radius:99px;background:color-mix(in oklab,var(--ink) 10%,transparent)}
.meter span i{display:block;height:100%;width:0;border-radius:99px;background:color-mix(in oklab,var(--ink) 70%,transparent);transition:width 1.1s cubic-bezier(.16,1,.3,1) .35s}
@media (max-width:360px){
  .build{padding:16px}
  .build li{gap:8px}
  .build .nm{font-size:.74rem}
  .meter{width:68px}
}

.sig{margin:24px 0 0;font-family:var(--ff-sans);font-size:.76rem;letter-spacing:0;color:var(--copy-note)}
.cta{margin-top:14px;display:flex;align-items:center;gap:12px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:99px;background:var(--ink);color:var(--paper);
  font-size:.82rem;font-weight:500;letter-spacing:0;
  -webkit-tap-highlight-color:transparent;
  transition:transform .3s,background-color .25s,scale .16s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{scale:.96}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translate(2px,-2px)}
.btn-o{
  width:46px;height:46px;border-radius:99px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink-2);-webkit-tap-highlight-color:transparent;
  transition:border-color .3s,color .3s,background-color .25s,scale .16s;
}
.btn-o:hover{border-color:color-mix(in oklab,var(--ink) 30%,transparent);color:var(--ink)}
.btn-o:active{scale:.96}

/* ============================================================
   The machine — laid out at a fixed 960x680, then scaled to fit
   ============================================================ */
.slot{
  position:relative;width:calc(100% + 48px);min-width:0;margin-inline:-24px;overflow:hidden;
}
@media (min-width:1024px){
  .slot{z-index:1;width:100%;margin-inline:0;overflow:visible;isolation:isolate}
}

@media (max-width:1023px){
  .capability-group{margin-top:44px}
  .action-group{margin-top:40px}
}

/* The physical scene stays deliberately sparse: one desk plane, one lamp,
   and the monitor. It frames the operating system without becoming a room. */
.workbench-atmosphere{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(to bottom,transparent 0 58%,color-mix(in oklab,var(--paper-2) 34%,transparent) 100%);
  transition:opacity .7s cubic-bezier(.22,1,.36,1);
}
.workbench-atmosphere::before{
  content:"";position:absolute;left:7%;right:4%;bottom:17%;height:34%;
  background:linear-gradient(112deg,transparent 0 48%,var(--lamp-beam) 63%,transparent 83%);
  opacity:.72;filter:blur(12px);
  transition:opacity .52s ease,background .52s ease;
}
.desk-surface{
  position:absolute;left:-5%;right:-5%;bottom:0;z-index:1;height:26%;
  background:linear-gradient(to bottom,color-mix(in oklab,var(--desk-top) 97%,white 3%),var(--desk-top) 64%,var(--desk-edge));
  border-top:1px solid var(--desk-line);
  box-shadow:inset 0 16px 34px rgba(255,255,255,.05),0 -26px 60px -44px rgba(26,25,22,.3);
  transform:perspective(900px) rotateX(2deg);transform-origin:center bottom;
  transition:opacity .64s cubic-bezier(.22,1,.36,1),translate .64s cubic-bezier(.22,1,.36,1),
             background .52s,border-color .52s;
}
.desk-surface::before{
  content:"";position:absolute;left:0;right:0;top:42%;height:1px;
  background:linear-gradient(to right,transparent,var(--desk-line) 18% 82%,transparent);
}
.desk-surface::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:14%;
  background:color-mix(in oklab,var(--desk-edge) 92%,black 8%);
  border-top:1px solid color-mix(in oklab,var(--desk-line) 75%,transparent);
}

.desk-plant{
  --desk-object-x:0px;
  position:absolute;left:-.6%;bottom:8%;z-index:5;width:92px;height:142px;
  padding:0;touch-action:none;cursor:grab;
  scale:.78;transform:translate3d(var(--desk-object-x),0,0);transform-origin:left bottom;
  filter:drop-shadow(0 13px 12px rgba(31,31,27,.16));
  transition:opacity .64s cubic-bezier(.22,1,.36,1),translate .64s cubic-bezier(.22,1,.36,1),
             filter .52s ease,scale .3s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1);
}
.desk-plant:hover,.desk-plant:focus-visible{scale:.84}
.desk-plant:focus-visible{outline:2px solid color-mix(in oklab,var(--ink) 38%,transparent);outline-offset:3px;border-radius:8px}
.desk-plant.dragging{cursor:grabbing;scale:.84;transition:opacity .64s,translate .64s,filter .52s,scale .2s}
.plant-stem{
  position:absolute;left:44px;bottom:42px;width:3px;height:67px;border-radius:3px;
  background:color-mix(in oklab,var(--plant-leaf) 82%,black 18%);
  transform-origin:bottom;
}
.plant-stem::before,.plant-stem::after{
  content:"";position:absolute;left:1px;bottom:30px;width:2px;height:40px;border-radius:2px;
  background:inherit;transform-origin:bottom;
}
.plant-stem::before{transform:rotate(-32deg)}
.plant-stem::after{transform:rotate(34deg)}
.plant-leaf{
  position:absolute;bottom:57px;width:29px;height:52px;
  border-radius:78% 12% 72% 16%;
  background:linear-gradient(145deg,var(--plant-leaf-2),var(--plant-leaf) 72%);
  box-shadow:inset 5px 3px 8px rgba(255,255,255,.08);
  transform-origin:50% 100%;
}
.plant-leaf::after{
  content:"";position:absolute;left:50%;top:8px;bottom:7px;width:1px;
  background:rgba(245,244,236,.2);transform:rotate(8deg);transform-origin:bottom;
}
.plant-leaf.l1{left:13px;bottom:51px;transform:rotate(-48deg) scale(.88)}
.plant-leaf.l2{left:25px;bottom:68px;transform:rotate(-24deg)}
.plant-leaf.l3{left:38px;bottom:76px;transform:rotate(8deg) scale(1.04)}
.plant-leaf.l4{left:52px;bottom:65px;transform:rotate(31deg) scale(.94)}
.plant-leaf.l5{left:61px;bottom:48px;transform:rotate(52deg) scale(.8)}
.plant-pot{
  position:absolute;left:25px;bottom:0;width:45px;height:46px;
  clip-path:polygon(5% 0,95% 0,82% 100%,18% 100%);
  background:linear-gradient(120deg,color-mix(in oklab,var(--plant-pot) 84%,white 16%),var(--plant-pot));
  border-top:1px solid rgba(255,255,255,.38);
  box-shadow:inset 5px 0 9px rgba(255,255,255,.08),0 8px 12px rgba(26,26,23,.16);
}
.plant-pot::before{
  content:"";position:absolute;left:4px;right:4px;top:5px;height:1px;
  background:rgba(61,60,55,.13);
}
html.dark .desk-plant{filter:brightness(.72) drop-shadow(0 10px 10px rgba(0,0,0,.2))}

@media (min-width:1024px){
  .workbench-atmosphere{
    left:calc(-1 * var(--scene-bridge));
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--scene-feather),#000 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 var(--scene-feather),#000 100%);
  }
  .desk-surface{
    left:calc(-1 * var(--scene-bridge));
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--scene-feather),#000 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 var(--scene-feather),#000 100%);
  }
  .desk-plant{left:clamp(-78px,-4vw,-52px)}
}

.desk-lamp{
  --desk-object-x:0px;
  position:absolute;right:calc(1.2% + 26px);bottom:8.5%;z-index:5;width:86px;height:18px;
  color:var(--lamp-body);transform:translate3d(var(--desk-object-x),0,0);transform-origin:50% 100%;
  filter:drop-shadow(0 16px 18px rgba(30,29,25,.18));touch-action:none;cursor:grab;
  transition:opacity .64s cubic-bezier(.22,1,.36,1),translate .64s cubic-bezier(.22,1,.36,1),
             filter .52s ease,color .52s ease,transform .18s cubic-bezier(.16,1,.3,1);
}
.desk-lamp.dragging{cursor:grabbing;transition:opacity .64s,translate .64s,filter .52s,color .52s}
.desk-lamp:hover{filter:drop-shadow(0 18px 20px rgba(30,29,25,.24))}
.desk-lamp:focus-visible{outline:none}
.desk-lamp:focus-visible .lamp-base{
  box-shadow:0 0 0 3px color-mix(in oklab,var(--ink) 24%,transparent),0 9px 18px rgba(28,27,24,.24);
}
.lamp-base{
  position:absolute;left:0;bottom:0;width:86px;height:18px;border-radius:50% 50% 42% 42%;
  background:linear-gradient(to bottom,var(--lamp-metal),var(--lamp-body));
  box-shadow:0 9px 18px rgba(28,27,24,.24),inset 0 1px rgba(255,255,255,.14);
  transition:background .52s,box-shadow .52s;
}
.lamp-base::after{
  content:"";position:absolute;right:14px;top:6px;width:6px;height:6px;border-radius:50%;
  background:var(--lamp-light);box-shadow:0 0 0 3px color-mix(in oklab,var(--lamp-light) 22%,transparent);
  transition:background .52s,box-shadow .52s;
}
.lamp-post{
  position:absolute;left:40px;bottom:14px;width:7px;height:142px;border-radius:4px;
  background:linear-gradient(to right,var(--lamp-body),var(--lamp-metal) 54%,var(--lamp-body));
  transform:rotate(2deg);transform-origin:bottom;
}
.lamp-joint{
  position:absolute;left:33px;bottom:146px;width:22px;height:22px;border:5px solid var(--lamp-body);
  border-radius:50%;background:var(--lamp-metal);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
}
.lamp-arm{
  position:absolute;left:45px;bottom:158px;width:122px;height:7px;border-radius:5px;
  background:linear-gradient(to bottom,var(--lamp-metal),var(--lamp-body));
  transform:rotate(-54deg);transform-origin:left center;box-shadow:inset 0 1px rgba(255,255,255,.12);
}
.lamp-arm::after{
  content:"";position:absolute;right:-8px;top:-7px;width:20px;height:20px;border-radius:50%;
  background:var(--lamp-body);box-shadow:inset 0 0 0 5px var(--lamp-metal);
}
.lamp-head{
  position:absolute;left:38px;bottom:233px;width:78px;height:56px;
  transform:rotate(19deg);transform-origin:64% 50%;
}
.lamp-shade{
  position:absolute;inset:0;border-radius:42% 52% 38% 46%;
  background:linear-gradient(135deg,var(--lamp-metal),var(--lamp-body) 72%);
  clip-path:polygon(13% 17%,82% 0,100% 76%,24% 100%,0 72%);
  box-shadow:inset 6px 5px 10px rgba(255,255,255,.07);
}
.lamp-bulb{
  position:absolute;left:11px;bottom:3px;width:49px;height:12px;border-radius:50%;
  background:var(--lamp-light);
  box-shadow:0 8px 24px color-mix(in oklab,var(--lamp-light) 66%,transparent),
             0 20px 54px color-mix(in oklab,var(--lamp-light) 34%,transparent);
  transition:background .52s,box-shadow .52s,opacity .52s;
}
html.dark .lamp-bulb{opacity:.28;box-shadow:none}
html.dark .desk-lamp{filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}

/* 整机始终保持完整构图；悬停只做轻微、居中的靠近反馈。 */
.scaler{
  position:absolute;left:0;top:0;z-index:3;width:960px;height:738px;transform-origin:top left;
  transition:transform .52s cubic-bezier(.16,1,.3,1);will-change:transform;
}
.machine{
  position:relative;width:960px;height:738px;
}
.ui-stage-workspace.in .machine{animation:enter .9s cubic-bezier(.16,1,.3,1) both}
@keyframes enter{from{opacity:0;translate:64px 0;scale:.985}to{opacity:1;translate:0 0;scale:1}}
.bezel{
  position:relative;height:680px;padding:11px;border-radius:28px;
  background:linear-gradient(to bottom,#3a352f,#2b2723 55%,#211e1a);
  box-shadow:0 50px 90px -40px rgba(30,26,22,.55),0 10px 30px -12px rgba(30,26,22,.3);
  transition:border-radius .34s ease,padding .34s ease,background .34s ease,box-shadow .34s ease;
}
.bezel::after{
  content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;border-radius:50%;
  translate:-50% 0;background:rgba(235,232,223,.24);
  transition:background .3s ease,box-shadow .3s ease;
}
.slot.zoom .bezel::after{background:#95c99c;box-shadow:0 0 0 3px rgba(149,201,156,.12)}
.screen{
  --reflection-x:74%;--reflection-y:16%;
  position:relative;height:100%;border-radius:19px;overflow:hidden;background:#a89f95;
  transition:border-radius .34s ease,filter .3s ease;
}
.screen::after{
  content:"";position:absolute;inset:0;z-index:60;pointer-events:none;
  background:radial-gradient(circle at var(--reflection-x) var(--reflection-y),rgba(255,255,255,.13),transparent 24%);
  opacity:0;mix-blend-mode:screen;transition:opacity .42s ease;
}
.slot.zoom .screen::after{opacity:.62}
.slot:not(.workspace-host) .screen{cursor:zoom-in}
.stand{position:absolute;left:0;right:0;top:680px;height:58px}
.neck{
  position:absolute;left:50%;translate:-50% 0;top:0;width:104px;height:47px;
  background:linear-gradient(to right,#221e1a,#453e36 30%,#332d27 64%,#1e1b17);
  clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);
}
.foot{
  position:absolute;left:50%;translate:-50% 0;top:45px;width:322px;height:13px;
  border-radius:8px/7px;background:linear-gradient(to bottom,#3d372f,#211e1a);
  box-shadow:0 5px 12px rgba(28,24,20,.4);
}
.contact{
  position:absolute;left:50%;translate:-50% 0;bottom:-16px;width:420px;height:26px;
  border-radius:50%;background:rgba(0,0,0,.14);filter:blur(18px);transition:opacity .5s ease;
}

/* ============================================================
   Hatari's cat — one actor, two stages, real occlusion
   ------------------------------------------------------------
   #cat-stage-scene lives INSIDE .slot, so its z-index interleaves
   with the scene layers (desk 1 / monitor 3 / plant + lamp 5).
   #cat-stage-ui lives outside .slot, for the two UI landings
   (title, button) that .slot's overflow:hidden would clip.
   The cat element is handed between the two stages while it moves.
   ============================================================ */
.cat-stage{
  position:absolute;inset:0;pointer-events:none;
  transition:opacity .4s ease;
}
#cat-stage-ui{z-index:6}
#cat-stage-scene[data-depth="back"]{z-index:2}   /* behind the monitor */
#cat-stage-scene[data-depth="mid"]{z-index:4}    /* past the monitor, behind the props */
#cat-stage-scene[data-depth="front"]{z-index:6}  /* in front of everything on the desk */

.hatari-cat{
  --cat-eye:#efe9d2;
  --cat-foot:5px;            /* paw line, measured up from the box bottom, per pose */
  --cat-shadow:0;
  position:absolute;left:0;top:0;width:80px;height:74px;
  margin:0;padding:0;border:0;background:none;-webkit-appearance:none;appearance:none;
  color:#12120f;opacity:0;overflow:visible;
  pointer-events:none;cursor:default;
  transform-origin:50% 100%;will-change:transform,opacity;
  transition:filter .35s ease;
}
.hero-ready .hatari-cat{opacity:1}
.hatari-cat[data-pettable="true"]{pointer-events:auto;cursor:pointer}
.hatari-cat[data-pettable="true"]:hover{filter:drop-shadow(0 6px 6px rgba(28,27,23,.18))}
.hatari-cat:focus-visible{
  outline:2px solid color-mix(in oklab,var(--ink) 44%,transparent);
  outline-offset:3px;border-radius:14px;
}

/* Pose determines where the paws are, so the shadow and the landing
   maths both read the same number. */
.hatari-cat[data-pose="sit"]{--cat-foot:5px}
.hatari-cat[data-pose="walk"]{--cat-foot:7.5px}
.hatari-cat[data-pose="loaf"]{--cat-foot:6px}
.hatari-cat[data-pose="stretch"]{--cat-foot:3.5px}
.hatari-cat[data-pose="peek"]{--cat-foot:2.5px}

/* Contact shadow: what actually glues the cat to a surface. */
.cat-shadow{
  position:absolute;left:50%;bottom:calc(var(--cat-foot) - 4px);
  width:54px;height:8px;margin-left:-27px;border-radius:50%;
  background:rgba(24,23,20,.42);filter:blur(3px);
  opacity:var(--cat-shadow);transition:opacity .45s ease;pointer-events:none;
}
html.dark .cat-shadow{background:rgba(0,0,0,.55)}

.hatari-cat-svg{position:relative;display:block;width:80px;height:74px;overflow:visible}
.cat-pose{display:none}
.hatari-cat[data-pose="sit"] [data-cat-pose="sit"],
.hatari-cat[data-pose="walk"] [data-cat-pose="walk"],
.hatari-cat[data-pose="loaf"] [data-cat-pose="loaf"],
.hatari-cat[data-pose="stretch"] [data-cat-pose="stretch"],
.hatari-cat[data-pose="peek"] [data-cat-pose="peek"]{display:block}
.cat-shape{fill:currentColor}
.cat-line{
  fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
}
/* Whiskers stay a fixed warm white: the body is near-black in both themes,
   so mixing against a theme token would make them vanish in the dark. */
.cat-detail{
  fill:none;stroke:rgba(255,253,246,.62);
  stroke-width:1.1;stroke-linecap:round;opacity:.5;
}
.cat-shape,.cat-line,.cat-detail{
  transition:opacity .42s cubic-bezier(.22,1,.36,1);
}
.cat-eye{
  fill:var(--cat-eye);transform-box:fill-box;transform-origin:center;
  transition:transform .08s ease,fill .45s ease,filter .45s ease,opacity .32s ease;
}
.cat-ear,.cat-tail,.cat-leg{
  transform-box:fill-box;transform-origin:center bottom;
}
.cat-tail{animation:catTail 3.8s ease-in-out infinite}
.hatari-cat[data-pose="walk"] .cat-leg-a{animation:catStepA .38s steps(2,end) infinite}
.hatari-cat[data-pose="walk"] .cat-leg-b{animation:catStepB .38s steps(2,end) infinite}
.hatari-cat.blink .cat-eye{transform:scaleY(.08)}
.hatari-cat.ear-twitch .cat-ear-l{animation:catEarL .44s ease-in-out 1}
.hatari-cat.ear-twitch .cat-ear-r{animation:catEarR .44s ease-in-out 1}
.hatari-cat.petted .cat-tail{animation-duration:.46s}
.hatari-cat.petted .cat-ear-l{animation:catEarL .34s ease-in-out 2}
.hatari-cat.petted .cat-ear-r{animation:catEarR .34s ease-in-out 2 .08s}

/* Lamp off: the black cat disappears into the room; only its eyes remain. */
html.dark .hatari-cat{--cat-eye:#f5ce70;color:#090907}
html.dark .hatari-cat-svg{filter:none}
html.dark .hatari-cat .cat-shape,
html.dark .hatari-cat .cat-line,
html.dark .hatari-cat .cat-detail{opacity:0}
html.dark .hatari-cat .cat-eye{
  opacity:1;
  stroke:rgba(255,228,157,.9);stroke-width:.65;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 1px rgba(245,206,112,.95))
         drop-shadow(0 0 3px rgba(245,206,112,.52));
}
html.dark .cat-shadow{opacity:0}

@keyframes catTail{
  0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(7deg)}
}
@keyframes catStepA{
  0%,49%{transform:translateY(0) rotate(0)}
  50%,100%{transform:translateY(-2px) rotate(8deg)}
}
@keyframes catStepB{
  0%,49%{transform:translateY(-2px) rotate(-8deg)}
  50%,100%{transform:translateY(0) rotate(0)}
}
@keyframes catEarL{0%,100%{transform:rotate(0)}45%{transform:rotate(-12deg)}68%{transform:rotate(5deg)}}
@keyframes catEarR{0%,100%{transform:rotate(0)}42%{transform:rotate(11deg)}70%{transform:rotate(-4deg)}}
body.workspace-entering .cat-stage,
body.workspace-live .cat-stage,
body.workspace-exiting .cat-stage{opacity:0;pointer-events:none}

@media (max-width:720px){
  .hatari-cat{pointer-events:none!important;cursor:default!important}
  .hatari-cat .cat-tail,
  .hatari-cat .cat-ear,
  .hatari-cat .cat-leg{animation:none!important}
}
@media (prefers-reduced-motion:reduce){
  html:not(.force-motion) .hatari-cat{pointer-events:none!important;cursor:default!important}
  html:not(.force-motion) .cat-tail,
  html:not(.force-motion) .cat-ear,
  html:not(.force-motion) .cat-leg{animation:none!important}
}
html.reduce-motion .hatari-cat{pointer-events:none!important;cursor:default!important}
html.reduce-motion .cat-tail,
html.reduce-motion .cat-ear,
html.reduce-motion .cat-leg{animation:none!important}

/* Spatial workspace portal. The same desktop DOM moves here, so every open
   window and conversation survives the camera transition. */
.workspace-portal{
  position:fixed;inset:0;z-index:100;visibility:hidden;overflow:hidden;pointer-events:none;
  contain:strict;isolation:isolate;
}
.workspace-portal.active{visibility:visible}
.workspace-portal::before{
  content:"";position:absolute;inset:0;background:var(--paper);opacity:0;
  transition:opacity .72s cubic-bezier(.22,1,.36,1),background-color .52s;
}
body.workspace-entering .workspace-portal::before,
body.workspace-live .workspace-portal::before{opacity:1}
body.workspace-live .workspace-portal{pointer-events:auto}
body.workspace-live .workspace-portal .scaler{
  position:absolute;inset:0;width:100%;height:100%;transform:none!important;transition:none;
}
body.workspace-live .workspace-portal .machine{width:100%;height:100%}
body.workspace-live .workspace-portal .bezel{
  position:absolute;inset:0;height:auto;padding:0;border-radius:0;background:transparent;box-shadow:none;
}
body.workspace-live .workspace-portal .bezel::after,
body.workspace-live .workspace-portal .stand,
body.workspace-live .workspace-portal .contact{opacity:0;pointer-events:none}
body.workspace-live .workspace-portal .screen{width:100%;height:100%;border-radius:0;cursor:default}
body.workspace-live .workspace-portal.settling .screen{animation:workspaceSettle .24s cubic-bezier(.22,1,.36,1)}
@keyframes workspaceSettle{
  from{opacity:.92;scale:1.004}
  to{opacity:1;scale:1}
}

.workspace-nav{
  position:fixed;left:0;right:0;top:0;z-index:160;height:42px;
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  color:rgba(255,255,255,.88);
  border-bottom:1px solid rgba(255,255,255,.12);
  background:rgba(30,28,25,.48);
  box-shadow:0 8px 28px rgba(26,23,20,.08);
  backdrop-filter:blur(18px) saturate(1.12);-webkit-backdrop-filter:blur(18px) saturate(1.12);
  opacity:0;translate:0 -7px;pointer-events:none;
  transition:opacity .32s ease,translate .42s cubic-bezier(.16,1,.3,1);
}
.workspace-nav[hidden]{display:none}
.workspace-nav-id{
  display:flex;align-items:center;gap:9px;
  font-family:var(--ff-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.7);
}
.workspace-nav-id i{
  width:7px;height:7px;border-radius:50%;background:#f1eee7;
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
}
.workspace-nav-links{display:flex;align-items:center;gap:26px;height:100%}
.workspace-nav-links a,.workspace-nav-links button{
  position:relative;display:inline-flex;align-items:center;height:100%;
  font-size:.74rem;letter-spacing:.01em;color:rgba(255,255,255,.68);
  transition:color .22s ease;
}
.workspace-nav-links a:hover,.workspace-nav-links button:hover,
.workspace-nav-links a:focus-visible,.workspace-nav-links button:focus-visible{color:#fff}
.workspace-nav-links [aria-current="page"]{color:#fff}
.workspace-nav-links [aria-current="page"]::after{
  content:"";position:absolute;left:50%;bottom:6px;width:3px;height:3px;border-radius:50%;
  background:currentColor;translate:-50% 0;
}
body.workspace-entering .workspace-nav,
body.workspace-live .workspace-nav{opacity:1;translate:0 0;pointer-events:auto}
.workspace-exit{display:none}

body.workspace-entering .hdr,
body.workspace-live .hdr{opacity:0;translate:0 -10px;pointer-events:none}
body.workspace-entering .intro-column,
body.workspace-live .intro-column{opacity:0;translate:-24px 0;pointer-events:none}
body.workspace-entering .workbench-atmosphere,
body.workspace-live .workbench-atmosphere{opacity:0}
body.workspace-entering .desk-surface,
body.workspace-live .desk-surface{opacity:0;translate:0 28px}
body.workspace-entering .desk-plant,
body.workspace-live .desk-plant{opacity:0;translate:-18px 8px}
body.workspace-entering .desk-lamp,
body.workspace-live .desk-lamp{opacity:0;translate:24px 8px}
body.workspace-entering .mlist,
body.workspace-live .mlist,
body.workspace-entering .ftr,
body.workspace-live .ftr{opacity:0;pointer-events:none}

body.workspace-live{overflow:hidden}
body.workspace-live .termwrap{left:auto;right:42px;top:auto;bottom:92px}
body.workspace-live .winwrap{max-width:calc(100vw - 32px)}

@media (max-width:920px){
  .desk-lamp{right:18px;scale:.86}
}
@media (max-width:720px){
  .desk-lamp,.desk-plant{display:none}
  .desk-surface{height:22%}
  .workbench-atmosphere::before{display:none}
  .workspace-nav{padding:0 14px}
  .workspace-nav-id span{display:none}
  .workspace-nav-links{gap:17px}
  .workspace-nav-links a,.workspace-nav-links button{font-size:.7rem}
  body.workspace-live .termwrap{display:none}
  body.workspace-live .mbar-r .dim{display:none}
  body.workspace-live .mbar-l{gap:8px}
  body.workspace-live .winwrap:not(.maximized){
    left:12px!important;top:96px!important;width:calc(100vw - 24px)!important;
    max-width:none;
  }
  body.workspace-live .support-chat{height:min(470px,calc(100vh - 170px))}
  body.workspace-live .dock{gap:5px;padding:8px 9px;border-radius:17px}
  body.workspace-live .dapp{width:34px;height:34px}
  body.workspace-live .dsep{height:29px;margin:0 1px}
  body.workspace-live .music-app{grid-template-columns:116px minmax(0,1fr)}
  body.workspace-live .music-player{padding:18px 14px 14px}
  body.workspace-live .music-cover{width:112px}
}

.wall{position:absolute;inset:-3.5%}

.di.document .art::before{
  content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;
  background:linear-gradient(225deg,rgba(255,255,255,0) 49%,#d9d4cc 50%,#f8f6f1 54%);
}
.di.document .file-glyph{width:16px;height:16px;display:block;translate:0 -5px}
.di.document .file-kind{
  position:absolute;left:4px;right:4px;bottom:5px;padding-top:3px;
  border-top:1px solid rgba(67,62,57,.13);
  font-family:var(--ff-mono);font-size:8px;font-weight:600;line-height:1;
  letter-spacing:.04em;
  color:rgba(52,49,45,.72);text-align:center;
}

.di .lbl{
  width:68px;min-height:24px;display:flex;align-items:flex-start;justify-content:center;
  padding:2px 4px;border-radius:4px;
  font-family:var(--ff-sans);font-size:10.5px;font-weight:600;line-height:1.2;letter-spacing:0;
  color:rgba(255,255,255,.98);text-align:center;text-wrap:balance;
  text-shadow:0 1px 3px rgba(27,24,21,.72);
  transition:background .2s ease;
}
.di:hover .lbl,.di:focus-visible .lbl,.di.on .lbl{background:rgba(31,29,26,.34)}
.di.on .art{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}

.live-dot{width:6px;height:6px;flex:0 0 auto;margin-top:3px;border-radius:99px;background:#83c790;box-shadow:0 0 0 0 rgba(131,199,144,.5);animation:livePulse 2.2s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(131,199,144,.45)}55%,100%{box-shadow:0 0 0 5px rgba(131,199,144,0)}}

/* workspace boot */
.workspace-boot{
  position:absolute;left:50%;top:47%;z-index:45;translate:-50% -50%;
  min-width:224px;text-align:center;color:rgba(255,255,255,.92);pointer-events:none;
  transition:opacity .75s cubic-bezier(.16,1,.3,1),translate .75s cubic-bezier(.16,1,.3,1);
}
.workspace-boot .boot-mark{position:relative;display:block;width:24px;height:24px;margin:0 auto 12px;border:1px solid rgba(255,255,255,.34);border-radius:99px}
.workspace-boot .boot-mark::after{content:"";position:absolute;inset:4px;border-top:1.5px solid #fff;border-radius:99px;animation:bootSpin 1.2s linear infinite}
.workspace-boot b{display:block;font-family:var(--ff-mono);font-size:11px;font-weight:400;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.workspace-boot span{display:block;margin-top:7px;font-family:var(--ff-mono);font-size:9px;color:rgba(255,255,255,.56)}
@keyframes bootSpin{to{rotate:360deg}}
.screen.os-booting .di,.screen.os-booting .window-layer,.screen.os-booting .termwrap,.screen.os-booting .dockwrap{opacity:0}
.screen.boot-complete .workspace-boot{opacity:0;translate:-50% calc(-50% - 8px)}
.screen.os-live .di{opacity:0;animation:diIn .52s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--boot-delay,0s)}
.screen.os-live .dock{animation:dockIn .7s cubic-bezier(.16,1,.3,1) both}
.screen.os-live .term{animation:termIn .6s cubic-bezier(.16,1,.3,1) .65s both}
.screen.os-live .window-layer{opacity:1;transition:opacity .45s ease}
.sync-status{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.12);-webkit-tap-highlight-color:transparent;transition:background-color .25s,scale .16s}
.sync-status:hover{background:rgba(0,0,0,.22)}
.sync-status:active{scale:.96}
.sync-status i{width:5px;height:5px;border-radius:99px;background:#91d29b;box-shadow:0 0 0 0 rgba(145,210,155,.45);animation:livePulse 2.4s ease-out infinite}
.sync-status span{font-size:10px}

/* application windows */
.window-layer{position:absolute;inset:0;z-index:30;pointer-events:none;transition:opacity .45s ease}
.winwrap{position:absolute;width:420px;pointer-events:auto;touch-action:none}
.win{
  border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 28px 60px -18px rgba(28,24,20,.45),0 2px 8px rgba(28,24,20,.16);
  transition:filter .28s ease,box-shadow .28s ease;
  transform-origin:18% 30%;
  animation:winIn .42s cubic-bezier(.16,1,.3,1) both;
}
.winwrap:not(.is-active) .win{
  filter:saturate(.86) brightness(.985);
  box-shadow:0 20px 44px -22px rgba(28,24,20,.36),0 1px 5px rgba(28,24,20,.1);
}
.winwrap.is-active .win{filter:none}
.win.out{animation:winOut .26s cubic-bezier(.4,0,1,1) both}
.winwrap.minimizing{animation:winMin .28s cubic-bezier(.4,0,1,1) both}
.winwrap.restoring{animation:winRestore .36s cubic-bezier(.16,1,.3,1) both}
@keyframes winMin{to{opacity:0;scale:.68;translate:120px 210px}}
@keyframes winRestore{from{opacity:0;scale:.76;translate:90px 160px}to{opacity:1;scale:1;translate:0 0}}
@keyframes winIn{from{opacity:0;scale:.93;translate:0 10px}to{opacity:1;scale:1;translate:0 0}}
@keyframes winOut{to{opacity:0;scale:.95;translate:0 6px}}
.win-hd{position:relative;height:42px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid rgba(0,0,0,.06);cursor:grab;user-select:none}
.win-hd:active{cursor:grabbing}
.lights{display:flex;align-items:center;gap:0;margin-left:-7px}
.lights span,.lights button{
  position:relative;width:28px;height:28px;padding:0;border:0;border-radius:8px;
  background:transparent;box-shadow:none;cursor:pointer;
  transition:background-color .2s,scale .16s;
}
.lights button::before{
  content:"";position:absolute;left:9px;top:9px;width:10px;height:10px;border-radius:99px;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:scale .16s;
}
.lights .r::before{background:#ec6a5e}
.lights .y::before{background:#f4bf4f}
.lights .g::before{background:#61c454}
.lights button:hover{background:rgba(0,0,0,.07)}
.lights button:hover::before{scale:1.12}
.lights button:active{scale:.96}
.lights button:focus-visible{outline:2px solid rgba(28,26,23,.62);outline-offset:1px}
.win-hd h2{position:absolute;left:0;right:0;margin:0;text-align:center;font-size:12.5px;font-weight:500;letter-spacing:0;color:rgba(28,26,23,.8);pointer-events:none}
.winwrap.maximized{left:18px!important;right:18px!important;top:42px!important;bottom:74px!important;width:auto!important}
.winwrap.maximized .win{height:100%;display:flex;flex-direction:column}
.winwrap.maximized .win-body{min-height:0;flex:1;overflow:auto}
.rows li+li{border-top:1px solid rgba(0,0,0,.055)}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;transition:background .2s;opacity:0;animation:rowIn .36s cubic-bezier(.16,1,.3,1) both}
@keyframes rowIn{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
.row:hover{background:rgba(255,255,255,.55)}
.row .ic{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;background:#1c1a17;color:rgba(255,255,255,.9);box-shadow:0 2px 5px rgba(24,22,20,.28)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:13.5px;font-weight:500;line-height:1.2;letter-spacing:0;color:#1c1a17;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .txt span{display:block;margin-top:3px;font-size:11.5px;line-height:1.2;color:#5d594f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dt{flex:0 0 auto;font-family:var(--ff-mono);font-size:10.5px;font-variant-numeric:tabular-nums;color:#8d887d}
.row .ch{flex:0 0 auto;color:#8d887d;transition:translate .3s,color .3s}
.row:hover .ch{translate:2px 0;color:#5d594f}
.win-ft{border-top:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.35)}
.win-ft a{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:12px;color:#5d594f;transition:color .3s}
.win-ft a:hover{color:#1c1a17}
.win-ft a svg{transition:translate .3s}
.win-ft a:hover svg{translate:4px 0}
.win-empty{padding:32px 20px}
.win-empty p{margin:0;font-size:13px;line-height:1.65;color:#1c1a17}
.win-empty p+p{margin-top:6px;font-size:12px;color:#5d594f}
.win-empty a{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;font-weight:500;color:#1c1a17}

/* about app */
.about-app{
  display:grid;grid-template-columns:132px minmax(0,1fr);min-height:264px;
  background:rgba(255,255,255,.42);
}
.about-side{
  padding:22px 16px;border-right:1px solid rgba(0,0,0,.065);
  background:rgba(241,238,232,.58);
}
.about-avatar{
  width:54px;height:54px;display:grid;place-items:center;border-radius:50%;
  background:#20201d;color:#f2f0ea;font-family:var(--ff-display);
  font-size:24px;font-weight:600;
}
.about-side strong{display:block;margin-top:14px;font-size:12px;font-weight:600;color:#24231f}
.about-side small{display:block;margin-top:4px;font-family:var(--ff-sans);font-size:10px;line-height:1.45;color:#767167}
.about-availability{display:flex;align-items:flex-start;gap:6px;margin-top:17px;font-size:10px;line-height:1.4;color:#5d594f}
.about-availability i{width:6px;height:6px;flex:0 0 auto;margin-top:2px;border-radius:50%;background:#72b57e}
.about-socials{display:grid;gap:6px;margin-top:15px}
.about-socials a{
  min-height:34px;display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:8px;
  font-size:10px;font-weight:600;line-height:1;color:#302e29;background:rgba(255,255,255,.62);
  box-shadow:inset 0 0 0 1px rgba(30,28,24,.09),0 3px 8px rgba(30,28,24,.06);
  transition:color .18s,background-color .18s,box-shadow .18s,translate .18s,scale .16s;
}
.about-socials a:hover{translate:0 -1px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(30,28,24,.14),0 5px 12px rgba(30,28,24,.1)}
.about-socials a:active{translate:0 0;scale:.96}
.about-socials svg{width:15px;height:15px;flex:0 0 auto;fill:currentColor}
.about-socials .about-xiaohongshu{color:#df1937;background:rgba(255,36,66,.075);box-shadow:inset 0 0 0 1px rgba(255,36,66,.16),0 3px 8px rgba(255,36,66,.06)}
.about-socials .about-xiaohongshu:hover{color:#c7112d;background:rgba(255,36,66,.12);box-shadow:inset 0 0 0 1px rgba(255,36,66,.24),0 5px 12px rgba(255,36,66,.12)}
.about-copy{padding:21px 22px 18px}
.about-copy .kicker{font-family:var(--ff-sans);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:#817c72}
.about-copy h3{margin:10px 0 0;font-size:18px;font-weight:600;line-height:1.23;color:#23221f}
.about-copy>p{margin:12px 0 0;font-size:11.5px;line-height:1.7;color:#5c584f}
.about-facts{margin-top:16px;border-top:1px solid rgba(0,0,0,.065)}
.about-facts li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.055)}
.about-facts b{font-family:var(--ff-sans);font-size:10px;font-weight:500;color:#817c72}
.about-facts span{font-size:10.5px;line-height:1.4;color:#47443d}
.about-copy a{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:10.5px;font-weight:600;color:#292723}

/* website assistant */
.support-chat{
  height:376px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
  overflow:hidden;background:rgba(246,245,241,.82);color:#282722;
}
.chat-agentbar{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-bottom:1px solid rgba(38,35,31,.075);background:rgba(255,255,255,.56);
}
.chat-agent-avatar{
  position:relative;width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;
  border-radius:9px;background:#20211e;color:#f7f5ef;box-shadow:0 5px 11px rgba(30,28,24,.16);
}
.chat-agent-avatar svg{width:17px;height:17px}
.chat-agent-avatar i{
  position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;
  border:2px solid #f7f6f2;border-radius:50%;background:#79bf86;
}
.chat-agent-copy{min-width:0}
.chat-agent-copy b{display:block;font-size:12px;font-weight:600;color:#25241f}
.chat-agent-copy span{display:flex;align-items:center;gap:5px;margin-top:3px;font-family:var(--ff-sans);font-size:10px;color:#6e6a61}
.chat-agent-copy span i{width:5px;height:5px;border-radius:50%;background:#79bf86}
.chat-transcript{
  min-height:0;padding:14px 14px 10px;overflow:auto;scrollbar-width:thin;
  background:linear-gradient(rgba(255,255,255,.3),rgba(239,236,230,.46));
}
.chat-message{display:flex;margin:0 0 10px}
.chat-message.user{justify-content:flex-end}
.chat-bubble{
  max-width:82%;margin:0;padding:9px 11px;border:1px solid rgba(38,35,31,.065);
  border-radius:4px 8px 8px 8px;background:rgba(255,255,255,.88);
  box-shadow:0 5px 15px -12px rgba(30,28,24,.35);
  font-size:10.5px;line-height:1.58;color:#4e4a42;white-space:pre-wrap;
}
.chat-message.user .chat-bubble{
  border-color:#24241f;border-radius:8px 4px 8px 8px;background:#24241f;color:#f6f3ec;
}
.chat-message.typing .chat-bubble{display:flex;align-items:center;gap:4px;min-width:42px;min-height:31px}
.chat-message.typing i{
  width:4px;height:4px;border-radius:50%;background:#89847a;
  animation:chatDot 1.1s ease-in-out infinite;
}
.chat-message.typing i:nth-child(2){animation-delay:.16s}
.chat-message.typing i:nth-child(3){animation-delay:.32s}
@keyframes chatDot{0%,65%,100%{opacity:.34;translate:0 0}32%{opacity:1;translate:0 -2px}}
.chat-suggestions{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;
  padding:9px 12px;border-top:1px solid rgba(38,35,31,.065);background:rgba(255,255,255,.46);
}
.chat-suggestion{
  min-height:34px;padding:7px 9px;border:1px solid rgba(37,34,30,.12);border-radius:6px;
  background:rgba(255,255,255,.72);font-size:9.5px;line-height:1.35;color:#47433c;text-align:left;
  transition:border-color .2s ease,background .2s ease,translate .2s ease;
}
.chat-suggestion:hover,.chat-suggestion:focus-visible{
  outline:none;border-color:rgba(37,34,30,.28);background:#fff;translate:0 -1px;
}
.chat-form{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px 12px;
  border-top:1px solid rgba(38,35,31,.065);background:rgba(250,249,246,.9);
}
.chat-input{
  min-width:0;height:35px;padding:0 11px;border:1px solid rgba(38,35,31,.14);border-radius:6px;
  background:#fff;font-size:10.5px;color:#2d2b27;outline:none;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.chat-input::placeholder{color:#9b968d}
.chat-input:focus{border-color:rgba(38,35,31,.4);box-shadow:0 0 0 3px rgba(38,35,31,.055)}
.chat-send{
  height:35px;padding:0 13px;border-radius:6px;background:#23231f;color:#f7f4ed;
  font-size:10px;font-weight:600;transition:background .2s ease,translate .2s ease;
}
.chat-send:hover,.chat-send:focus-visible{outline:none;background:#0f0f0d;translate:0 -1px}
.chat-send:disabled,.chat-suggestion:disabled,.chat-input:disabled{cursor:default;opacity:.48;translate:0 0}

/* thinking app */
.notes-app{display:grid;grid-template-columns:138px minmax(0,1fr);min-height:250px;background:rgba(255,255,255,.34)}
.notes-list{padding:8px;border-right:1px solid rgba(0,0,0,.065);background:rgba(242,239,233,.63)}
.note-item{display:block;width:100%;padding:9px 8px;border-radius:7px;text-align:left;transition:background .2s}
.note-item:hover,.note-item.active{background:rgba(255,255,255,.8)}
.note-item b{display:block;overflow:hidden;font-size:10.5px;font-weight:600;color:#2b2925;text-overflow:ellipsis;white-space:nowrap}
.note-item span{display:block;margin-top:4px;font-family:var(--ff-mono);font-size:10px;color:#807b71}
.note-paper{padding:20px 21px;background:rgba(255,255,255,.55)}
.note-paper time{font-family:var(--ff-mono);font-size:10px;color:#837e75}
.note-paper h3{margin:12px 0 0;font-size:17px;font-weight:600;line-height:1.22;color:#24231f}
.note-paper p{margin:13px 0 0;font-size:11.5px;line-height:1.72;color:#5f5a51}
.note-paper a{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:10.5px;font-weight:600;color:#2d2b27}

/* code app */
.code-app{display:grid;grid-template-columns:94px minmax(0,1fr);min-height:260px;background:#1d1f1c;color:#d7dbd3}
.code-side{padding:13px 10px;border-right:1px solid rgba(255,255,255,.065);background:#181a18}
.code-side b{display:block;margin-bottom:11px;font-family:var(--ff-mono);font-size:9px;font-weight:500;text-transform:uppercase;color:#8f958d}
.code-file{display:flex;align-items:center;gap:5px;margin-top:8px;font-family:var(--ff-mono);font-size:9px;color:#a8ada6}
.code-file i{width:5px;height:5px;border-radius:1px;background:#7ea186}
.code-main{min-width:0}
.code-tabs{height:30px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--ff-mono);font-size:9px;color:#b5bab3}
.code-tabs span{height:30px;padding:10px 12px 0;border-right:1px solid rgba(255,255,255,.05);background:#20231f}
.code-lines{counter-reset:line;padding:14px 12px;font-family:var(--ff-mono);font-size:9.5px;line-height:1.8}
.code-lines p{margin:0;white-space:pre;color:#c3c8c0}
.code-lines p::before{counter-increment:line;content:counter(line);display:inline-block;width:20px;margin-right:10px;color:#555b54;text-align:right}
.code-lines .kw{color:#b7a8d7}.code-lines .fn{color:#8eb4ca}.code-lines .str{color:#b7c494}.code-lines .cm{color:#6f756d}
.commit-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid rgba(255,255,255,.07);background:#171917;font-family:var(--ff-mono);font-size:9px;color:#9da29a}
.commit-strip b{font-weight:500;color:#b9c4b7}
.commit-strip a{color:#d8ddd5}

/* music app */
.music-app{min-height:306px;display:grid;grid-template-columns:142px minmax(0,1fr);background:rgba(248,247,243,.82);color:#27251f}
.music-library{padding:14px 10px;border-right:1px solid rgba(40,36,31,.075);background:rgba(239,237,232,.68)}
.music-library>span{display:block;padding:0 7px 9px;font-family:var(--ff-sans);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:#807b71}
.music-track{width:100%;display:grid;grid-template-columns:25px minmax(0,1fr);gap:8px;align-items:center;padding:7px;border-radius:6px;text-align:left;transition:background .2s}
.music-track:hover,.music-track.active{background:rgba(255,255,255,.82)}
.music-track i{width:25px;height:25px;border-radius:5px;background:linear-gradient(135deg,#d96659 0 34%,#eed28d 34% 65%,#4e6b5c 65%)}
.music-track:nth-of-type(2) i{background:linear-gradient(145deg,#5f7d75 0 42%,#d8b7a6 42% 70%,#343a36 70%)}
.music-track:nth-of-type(3) i{background:linear-gradient(135deg,#d8bd75 0 38%,#8c9daa 38% 68%,#684c4b 68%)}
.music-track b{display:block;overflow:hidden;font-size:10px;font-weight:600;color:#35322c;text-overflow:ellipsis;white-space:nowrap}
.music-track small{display:block;overflow:hidden;margin-top:2px;font-size:9px;color:#837d73;text-overflow:ellipsis;white-space:nowrap}
.music-player{display:flex;flex-direction:column;align-items:center;padding:22px 24px 16px;text-align:center}
.music-cover{position:relative;width:128px;aspect-ratio:1;overflow:hidden;border-radius:8px;background:linear-gradient(135deg,#d96659 0 34%,#eed28d 34% 65%,#4e6b5c 65%);box-shadow:0 18px 34px -20px rgba(39,33,27,.62);transition:background .35s}
.music-cover::before{content:"";position:absolute;inset:14%;border:1px solid rgba(255,255,255,.38);border-radius:50%}
.music-cover::after{content:"WORKSPACE\A SESSIONS";position:absolute;left:11px;bottom:10px;white-space:pre;font-family:var(--ff-mono);font-size:7px;line-height:1.35;text-align:left;color:rgba(255,255,255,.88)}
.music-cover[data-cover="1"]{background:linear-gradient(145deg,#5f7d75 0 42%,#d8b7a6 42% 70%,#343a36 70%)}
.music-cover[data-cover="2"]{background:linear-gradient(135deg,#d8bd75 0 38%,#8c9daa 38% 68%,#684c4b 68%)}
.music-meta{margin-top:13px}
.music-meta b{display:block;font-size:12px;font-weight:600;color:#282620}
.music-meta span{display:block;margin-top:3px;font-size:10px;color:#777167}
.music-timeline{width:100%;margin-top:14px}

.music-times{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--ff-mono);font-size:9px;color:#837e75}
.music-controls{display:flex;align-items:center;justify-content:center;gap:19px;margin-top:10px}
.music-control{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;color:#403d36;transition:background .2s,scale .18s}

.music-control svg{width:15px;height:15px}

/* Maximized apps use the available workspace instead of keeping their
   compact 420px-window proportions. */
body.workspace-live .winwrap.maximized .win-body{overflow:hidden}
body.workspace-live .winwrap.maximized .code-app,
body.workspace-live .winwrap.maximized .music-app{
  width:100%;height:100%;min-height:0;
}

body.workspace-live .winwrap.maximized .code-app{
  grid-template-columns:clamp(112px,10vw,176px) minmax(0,1fr);
}
body.workspace-live .winwrap.maximized .code-side{
  padding:20px 16px;overflow:auto;
}
body.workspace-live .winwrap.maximized .code-side b{
  margin-bottom:16px;font-size:10px;
}
body.workspace-live .winwrap.maximized .code-file{
  gap:7px;margin-top:11px;font-size:10px;
}
body.workspace-live .winwrap.maximized .code-file i{width:6px;height:6px}
body.workspace-live .winwrap.maximized .code-main{
  display:flex;min-height:0;flex-direction:column;
}
body.workspace-live .winwrap.maximized .code-tabs{
  height:38px;flex:0 0 38px;font-size:10px;
}
body.workspace-live .winwrap.maximized .code-tabs span{
  height:38px;padding:13px 16px 0;
}
body.workspace-live .winwrap.maximized .code-lines{
  min-height:0;flex:1;overflow:auto;
  padding:22px clamp(18px,2.2vw,36px);
  font-size:clamp(10px,.72vw,13px);line-height:1.78;
}
body.workspace-live .winwrap.maximized .commit-strip{
  flex:0 0 auto;padding:13px 18px;font-size:10px;
}

body.workspace-live .winwrap.maximized .music-app{
  grid-template-columns:clamp(150px,12vw,214px) minmax(0,1fr);
}
body.workspace-live .winwrap.maximized .music-library{
  padding:22px 14px;overflow:auto;
}
body.workspace-live .winwrap.maximized .music-library>span{
  padding:0 9px 14px;font-size:9px;
}
body.workspace-live .winwrap.maximized .music-track{
  grid-template-columns:38px minmax(0,1fr);gap:10px;padding:9px;
}
body.workspace-live .winwrap.maximized .music-track i{
  width:38px;height:38px;border-radius:7px;
}
body.workspace-live .winwrap.maximized .music-track b{font-size:11px}
body.workspace-live .winwrap.maximized .music-track small{font-size:9px}
body.workspace-live .winwrap.maximized .music-player{
  min-width:0;min-height:0;justify-content:center;
  padding:clamp(28px,5vh,64px) clamp(32px,6vw,96px);
}
body.workspace-live .winwrap.maximized .music-cover{
  width:clamp(144px,20vh,196px);
}
body.workspace-live .winwrap.maximized .music-cover::after{
  left:14px;bottom:13px;font-size:8px;
}
body.workspace-live .winwrap.maximized .music-meta{margin-top:18px}
body.workspace-live .winwrap.maximized .music-meta b{font-size:16px}
body.workspace-live .winwrap.maximized .music-meta span{font-size:10px}
body.workspace-live .winwrap.maximized .music-timeline{
  width:min(100%,720px);margin-top:20px;
}
body.workspace-live .winwrap.maximized .music-times{font-size:9px}
body.workspace-live .winwrap.maximized .music-controls{
  gap:24px;margin-top:15px;
}
body.workspace-live .winwrap.maximized .music-control{width:32px;height:32px}
body.workspace-live .winwrap.maximized .music-control.music-toggle{width:44px;height:44px}
body.workspace-live .winwrap.maximized .music-control svg{width:18px;height:18px}
body.workspace-live .winwrap.maximized .music-volume-row{
  width:120px;grid-template-columns:14px 1fr;gap:9px;margin-top:17px;
}
body.workspace-live .winwrap.maximized .music-volume-row svg{width:14px;height:14px}

@media (max-width:720px){
  body.workspace-live .winwrap.maximized .music-app{
    grid-template-columns:112px minmax(0,1fr);
  }
  body.workspace-live .winwrap.maximized .music-library{padding:14px 8px}
  body.workspace-live .winwrap.maximized .music-track{
    grid-template-columns:28px minmax(0,1fr);gap:7px;padding:7px 5px;
  }
  body.workspace-live .winwrap.maximized .music-track i{width:28px;height:28px}
  body.workspace-live .winwrap.maximized .music-player{padding:20px 14px}
  body.workspace-live .winwrap.maximized .music-cover{width:min(124px,24vh)}
  body.workspace-live .winwrap.maximized .music-timeline{margin-top:14px}

/* inspiration app */
.inspiration-app{padding:12px;background:rgba(248,246,241,.7)}
.inspiration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.inspiration-tile{position:relative;aspect-ratio:1;overflow:hidden;border-radius:7px;background:#d9d3c9}
.inspiration-tile:nth-child(2){background:#a9b5b1}.inspiration-tile:nth-child(3){background:#cac1b6}
.inspiration-tile:nth-child(4){background:#7c7c74}.inspiration-tile:nth-child(5){background:#d6d9d1}.inspiration-tile:nth-child(6){background:#b8aba0}
.inspiration-tile::before{content:"";position:absolute;left:-15%;right:-15%;bottom:-20%;height:65%;background:rgba(255,255,255,.32);clip-path:polygon(0 100%,24% 32%,44% 72%,67% 9%,100% 100%)}
.inspiration-caption{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-family:var(--ff-sans);font-size:8.5px;color:#767168}

/* terminal */
.termwrap{position:absolute;left:584px;top:444px;z-index:20;width:296px}
.termshift{transition:translate .78s cubic-bezier(.16,1,.3,1)}
.term{
  border-radius:13px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);background:rgba(20,20,18,.92);
  box-shadow:0 20px 44px -14px rgba(20,18,16,.7);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:termIn .6s cubic-bezier(.16,1,.3,1) .75s both;
}
@keyframes termIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.term-body{height:124px;padding:11px 14px;font-family:var(--ff-mono);font-size:10.5px;line-height:1.55}
.term-body p{margin:0;white-space:pre}
.term-body .p0{color:#9c968b}
.term-body .p1{color:#e8e4da}
.term-body .p2{color:#c3bdb1}
.term-body .status{color:#a8b4a5;animation:statusIn .42s cubic-bezier(.16,1,.3,1) both}
@keyframes statusIn{from{opacity:0;translate:0 3px}to{opacity:1;translate:0 0}}
.caret{display:inline-block;width:6px;height:11px;background:#e8e4da;vertical-align:middle;margin-left:6px;animation:blink 1.05s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* dock */
.dockwrap{position:absolute;left:0;right:0;bottom:14px;z-index:30;display:flex;justify-content:center}
.dock{
  display:flex;align-items:flex-end;gap:10px;padding:10px 12px;border-radius:20px;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.18);
  box-shadow:0 18px 40px -14px rgba(24,20,16,.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  animation:dockIn .7s cubic-bezier(.16,1,.3,1) .6s both;
}
@keyframes dockIn{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
.dapp{
  --dock-scale:1;--dock-lift:0px;
  position:relative;width:42px;height:42px;flex:0 0 auto;
  transform:translate3d(0,var(--dock-lift),0) scale(var(--dock-scale));
  transform-origin:center bottom;will-change:transform;
  transition:transform .22s cubic-bezier(.16,1,.3,1);
}
.dapp svg{width:100%;height:100%;display:block;border-radius:12px;transition:transform .14s ease,filter .14s ease}
.dapp:active svg{transform:scale(.96);filter:brightness(.9)}
.dapp:focus-visible{--dock-scale:1.1;--dock-lift:-5px}
.dapp:not(.trash) svg{box-shadow:0 2px 6px rgba(0,0,0,.22)}
.tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 0;
  padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.72);
  font-family:var(--ff-mono);font-size:10px;color:rgba(255,255,255,.9);
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;
}
.dapp:hover .tip{opacity:1}
.run{position:absolute;bottom:-7px;left:50%;translate:-50% 0;width:3px;height:3px;border-radius:99px;background:rgba(255,255,255,.7)}
.dsep{width:1px;height:38px;align-self:center;margin:0 2px;background:rgba(255,255,255,.25)}

/* ============================================================
   Mobile project list
   ============================================================ */
.mlist{display:block}
@media (min-width:1024px){.mlist{display:none}}
.mlist ul{margin-top:12px}
.mlist li+li{border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 0}
.mrow .ic{width:36px;height:36px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:rgba(255,255,255,.9)}
.mrow .txt{flex:1;min-width:0}
.mrow .txt b{display:block;font-size:.875rem;font-weight:500;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .txt span{display:block;margin-top:4px;font-size:.76rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .dt{font-family:var(--ff-mono);font-size:.65rem;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.mrow .ch{color:var(--ink-3)}

.ftr{border-top:1px solid var(--line);background:var(--paper-2)}
.ftr-in{display:flex;flex-direction:column;gap:20px;padding:28px 24px}
@media (min-width:640px){.ftr-in{flex-direction:row;align-items:center;justify-content:space-between}}
@media (min-width:1024px){.ftr-in{padding:28px 40px}}
.ftr p{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-family:var(--ff-sans);font-size:.75rem;color:var(--ink-3)}
.socials{display:flex;align-items:center;gap:4px}
.socials a,.socials button{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;color:var(--ink-3);-webkit-tap-highlight-color:transparent;transition:background-color .25s,color .25s,scale .16s}
.socials a:hover,.socials button:hover{background:color-mix(in oklab,var(--ink) 5%,transparent);color:var(--ink)}
.socials a:active,.socials button:active{scale:.96}

/* ============================================================
   Reduced motion — 动效只承载氛围，不承载信息
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  html:not(.force-motion) *,html:not(.force-motion) *::before,html:not(.force-motion) *::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  html:not(.force-motion) .plx{translate:none!important}
}
html.reduce-motion *,html.reduce-motion *::before,html.reduce-motion *::after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;
}
html.reduce-motion .plx{translate:none!important}

/* ============================================================
   Hero 打字动画

   两个决定值得说明：
   1) 逐字"显示"而不是逐字"追加"。所有字符从第一帧就排好版，只改 opacity。
      追加字符串会让标题从 0 行长到 2 行，把下面所有内容一路顶下去 ——
      这正是廉价打字效果的来源。现在版面从头到尾一动不动。
   2) 时间轴一次性算好，用 rAF 播放。不是一串嵌套 setTimeout，所以随时可以
      跳到结尾（用户一交互就跳），也不会因为标签页休眠而乱掉节奏。
   ============================================================ */
(function(){
  var HERO_COPY = {
    zh: { head:"Hi, I’m Hatari.", lede:"我构建能解决\n真实问题的 AI 产品。" },
    en: { head:"Hi, I\u2019m Hatari.", lede:"I build AI products that\nsolve real problems." }
  };
  var initialCopy = HERO_COPY[window.HATARI_LANG === "en" ? "en" : "zh"];
  var STEPS = [
    { el: $("t-head"), text: initialCopy.head, base: 42, leadIn: 300, tail: 140 },
    { el: $("t-lede"), text: initialCopy.lede, base: 25, leadIn: 120, tail: 120 }
  ];
  var subtitleStage = document.querySelector(".stage-subtitle");
  var exploreStages = [].slice.call(document.querySelectorAll(".stage-explore"));
  var progressStages = [].slice.call(document.querySelectorAll(".stage-progress"));
  var headerStage = document.querySelector(".ui-stage-header");
  var workspaceStage = document.querySelector(".ui-stage-workspace");

  function fillBars(){
    var bars = document.querySelectorAll(".meter i");
    for (var i=0;i<bars.length;i++) bars[i].style.width = bars[i].getAttribute("data-w")+"%";
  }

  /* ---- 把每个块拆成字符 span，并各自挂一个 caret ---- */
  var blocks = [];
  for (var i=0;i<STEPS.length;i++){
    var st = STEPS[i], el = st.el;
    var text = st.text || el.textContent;
    var frag = document.createDocumentFragment();
    var spans = [];
    for (var c=0;c<text.length;c++){
      if (text.charAt(c) === "\n"){
        frag.appendChild(document.createElement("br"));
        spans.push(null);
        continue;
      }
      var sp = document.createElement("span");
      sp.textContent = text.charAt(c);
      frag.appendChild(sp); spans.push(sp);
    }
    el.textContent = "";
    el.appendChild(frag);
    var caret = document.createElement("i");
    caret.className = "hero-caret";
    el.appendChild(caret);
    el.style.visibility = "visible";
    blocks.push({ el: el, spans: spans, caret: caret, text: text, lastTop: -999 });
  }

  /* ---- caret 跟到最后一个已显示字符的右缘 ---- */
  function placeCaret(b, count){
    var afterBreak = count > 0 && b.text.charAt(count - 1) === "\n";
    var idx = afterBreak ? Math.min(count, b.spans.length - 1) : Math.max(0, count - 1);
    var span = b.spans[idx];
    if (!span) return;
    var r = span.getBoundingClientRect(), box = b.el.getBoundingClientRect();
    if (!r.height) return;
    var x = (count === 0 || afterBreak ? r.left : r.right) - box.left;
    var y = r.top - box.top + r.height * 0.14;
    var h = r.height * 0.74;
    // 换行时不要让 caret 斜着滑过去
    if (Math.abs(y - b.lastTop) > 2){
      b.caret.style.transition = "none";
      b.caret.style.top = y + "px";
      void b.caret.offsetHeight;
      b.caret.style.transition = "";
    } else {
      b.caret.style.top = y + "px";
    }
    b.lastTop = y;
    b.caret.style.left = x + "px";
    b.caret.style.height = h + "px";
    b.caret.style.width = Math.max(2, Math.round(r.height * 0.045)) + "px";
  }

  /* ---- 人手节奏：抖动 + 标点停顿 + 大写换挡 ---- */
  function gap(base, ch, prev){
    var d = base * (0.86 + Math.random() * 0.38);
    if (prev === ",") d += 72;
    if (prev === "." || prev === "!" || prev === "?") d += 120;
    if (ch === "\n") return d + 110;
    if (ch === " ") d += 22;
    if (ch >= "A" && ch <= "Z") d += 14;
    return d;
  }

  /* ---- 预先铺出整条时间轴，每帧都携带完整状态 ---- */
  var frames = [], t = 0;
  var counts = [0, 0];
  function push(caretStep, caretMode){
    frames.push({ at: t, counts: counts.slice(), cs: caretStep, cm: caretMode });
  }
  for (var i=0;i<STEPS.length;i++){
    push(i, "blink");                       // caret 先出现并呼吸
    t += STEPS[i].leadIn;
    push(i, "solid");                       // 开始打字，caret 停止闪烁
    var text = blocks[i].text;
    for (var c=0;c<text.length;c++){
      t += gap(STEPS[i].base, text.charAt(c), c ? text.charAt(c-1) : "");
      counts[i] = c + 1;
      push(i, "solid");
    }
    t += 80;
    push(i, "blink");                       // 打完歇一下
    t += STEPS[i].tail;
  }
  push(STEPS.length - 1, "fade");           // caret 缓慢淡出
  t += 120;
  var revealAt = t;
  t += 560;
  push(STEPS.length - 1, "off");
  var total = t + 80;

  /* ---- 应用某一帧 ---- */
  function apply(f){
    for (var i=0;i<blocks.length;i++){
      var b = blocks[i], n = f.counts[i];
      for (var c=0;c<b.spans.length;c++){
        if (!b.spans[c]) continue;
        var on = c < n;
        if (on !== (b.spans[c].className === "on")) b.spans[c].className = on ? "on" : "";
      }
      if (i === f.cs){
        placeCaret(b, n);
        b.caret.className = "hero-caret" + (f.cm === "off" ? "" :
          f.cm === "fade" ? " fade" : f.cm === "blink" ? " show blink" : " show");
      } else {
        b.caret.className = "hero-caret";
      }
    }
  }

  function settleBlocks(){
    blocks.forEach(function(b){
      var lines = b.text.split("\n");
      b.el.textContent = "";
      lines.forEach(function(line, i){
        if (i) b.el.appendChild(document.createElement("br"));
        var perchAt = b.el.id === "t-head" ? line.lastIndexOf("Hatari.") : -1;
        if (perchAt < 0) {
          b.el.appendChild(document.createTextNode(line));
          return;
        }
        b.el.appendChild(document.createTextNode(line.slice(0,perchAt)));
        var perch = document.createElement("span");
        perch.id = "title-perch";
        perch.className = "title-perch";
        perch.textContent = line.slice(perchAt);
        b.el.appendChild(perch);
      });
    });
  }

  var revealed = false;
  function revealStages(){
    if (revealed) return;
    revealed = true;
    if (subtitleStage) setTimeout(function(){ subtitleStage.classList.add("in"); }, 0);
    if (headerStage) setTimeout(function(){ headerStage.classList.add("in"); }, 70);
    exploreStages.forEach(function(el, i){
      setTimeout(function(){ el.classList.add("in"); }, 150 + i * 85);
    });
    progressStages.forEach(function(el, i){
      setTimeout(function(){
        el.classList.add("in");
        if (el.className.indexOf("build") > -1) fillBars();
      }, 310 + i * 70);
    });
    setTimeout(function(){
      if (workspaceStage) workspaceStage.classList.add("in");
      document.documentElement.classList.add("hero-ready");
      document.dispatchEvent(new CustomEvent("hero:ready"));
    }, 360);
    setTimeout(fillBars, 560);
  }

  var raf = 0, cursorFrame = 0, start = 0, finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    cancelAnimationFrame(raf);
    apply({ counts: blocks.map(function(b){ return b.text.length; }), cs: -1, cm: "off" });
    settleBlocks();
    revealStages();
  }

  var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
  var prefersReduce = !!(mq && mq.matches);
  var explicitlyReduced = document.documentElement.classList.contains("reduce-motion");
  var forced = document.documentElement.classList.contains("force-motion");
  var reduce = explicitlyReduced || (prefersReduce && !forced);

  /* 排查用：控制台敲 window.__hero 就知道走了哪条分支、为什么 */
  window.__hero = {
    scripting: true,
    prefersReducedMotion: prefersReduce,
    forced: forced,
    explicitlyReduced: explicitlyReduced,
    mode: reduce ? "reduced motion" : "typewriter",
    hint: reduce ? "移除 ?motion=reduce 可恢复完整动效" : "默认完整动效模式"
  };

  window.__setHeroLanguage = function(language){
    var copy = HERO_COPY[language === "en" ? "en" : "zh"];
    if (!finished) finish();
    blocks[0].text = copy.head;
    blocks[1].text = copy.lede;
    settleBlocks();
  };

  if (reduce) { finish(); return; }

  function loop(now){
    var elapsed = now - start, due = null;
    while (cursorFrame < frames.length && frames[cursorFrame].at <= elapsed){
      due = frames[cursorFrame++];
    }
    if (due) apply(due);
    if (elapsed >= revealAt) revealStages();
    if (elapsed < total) raf = requestAnimationFrame(loop);
    else {
      settleBlocks();
      finished = true;
    }
  }
  requestAnimationFrame(function(now){ start = now; loop(now); });

  /* Escape is the only skip command; focus clicks and scrolling must not
     accidentally collapse the intro into its completed state. */
  function skipIntro(e){
    if (e.key !== "Escape") return;
    window.removeEventListener("keydown",skipIntro);
    finish();
  }
  window.addEventListener("keydown",skipIntro);
})();

var musicTrackUrls = {};
function createMusicTrackUrl(index){
  if (musicTrackUrls[index]) return musicTrackUrls[index];
  var track = MUSIC_TRACKS[index] || MUSIC_TRACKS[0];
  var sampleRate = 16000;
  var duration = 24;
  var sampleCount = sampleRate * duration;
  var buffer = new ArrayBuffer(44 + sampleCount * 2);
  var view = new DataView(buffer);
  var writeText = function(offset, text){
    for (var i=0;i<text.length;i++) view.setUint8(offset+i,text.charCodeAt(i));
  };
  writeText(0,"RIFF");
  view.setUint32(4,36 + sampleCount * 2,true);
  writeText(8,"WAVE");
  writeText(12,"fmt ");
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate * 2,true);
  view.setUint16(32,2,true);
  view.setUint16(34,16,true);
  writeText(36,"data");
  view.setUint32(40,sampleCount * 2,true);

  var chords = [
    [1,1.25,1.5],
    [1.125,1.333,1.667],
    [.833,1.04,1.25],
    [.75,1,1.2]
  ];
  var melody = [1,1.125,1.25,1.5,1.25,1.125,1.667,1.5];
  var beat = 60 / track.tempo;
  for (var s=0;s<sampleCount;s++){
    var t = s / sampleRate;
    var chord = chords[Math.floor(t / (beat * 4)) % chords.length];
    var pad = 0;
    for (var c=0;c<chord.length;c++){
      var frequency = track.root * chord[c];
      pad += Math.sin(Math.PI * 2 * frequency * t + c * .7) * (.052 / (c + 1));
      pad += Math.sin(Math.PI * 2 * frequency * .5 * t) * .016;
    }
    var noteStep = Math.floor(t / (beat / 2));
    var notePhase = (t % (beat / 2)) / (beat / 2);
    var noteEnvelope = Math.pow(Math.sin(Math.PI * notePhase),1.7);
    var noteFrequency = track.root * 2 * melody[(noteStep + index * 2) % melody.length];
    var lead = Math.sin(Math.PI * 2 * noteFrequency * t) * .026 * noteEnvelope;
    var bassFrequency = track.root * .5 * chord[0];
    var bass = Math.sin(Math.PI * 2 * bassFrequency * t) * .032 * (1 - Math.min(1,(t % beat) / beat));
    var fade = Math.min(1,t / .8,(duration - t) / 1.1);
    var sample = Math.max(-1,Math.min(1,(pad + lead + bass) * Math.max(0,fade)));
    view.setInt16(44 + s * 2,Math.round(sample * 32767),true);
  }
  musicTrackUrls[index] = URL.createObjectURL(new Blob([view],{type:"audio/wav"}));
  return musicTrackUrls[index];
}

function formatMusicTime(value){
  if (!Number.isFinite(value) || value < 0) value = 0;
  var minutes = Math.floor(value / 60);
  var seconds = Math.floor(value % 60);
  return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
}

function initMusicPlayer(wrap){
