  var toggle = root.querySelector('[data-music-action="toggle"]');
  var seek = root.querySelector(".music-seek");
  var volume = root.querySelector(".music-volume");
  var currentLabel = root.querySelector("[data-current-time]");
  var durationLabel = root.querySelector("[data-duration]");
  var title = root.querySelector("[data-music-title]");
  var artist = root.querySelector("[data-music-artist]");
  var cover = root.querySelector(".music-cover");
  var currentIndex = 0;
  var playIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.2 5.7v12.6L18 12z"/></svg>';
  var pauseIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 6h3v12h-3zM13.5 6h3v12h-3z"/></svg>';

  function renderPlaying(){
    var playing = !audio.paused;
    toggle.innerHTML = playing ? pauseIcon : playIcon;
    toggle.setAttribute("aria-label",playing ? (homeLanguage === "en" ? "Pause" : "暂停") : (homeLanguage === "en" ? "Play" : "播放"));
  }
  function renderTrack(){
    var track = MUSIC_TRACKS[currentIndex];
    title.textContent = track.title;
    artist.textContent = track.artist;
    cover.setAttribute("data-cover",String(currentIndex));
    var buttons = root.querySelectorAll(".music-track");
    for (var i=0;i<buttons.length;i++) buttons[i].classList.toggle("active",i === currentIndex);
  }
  function setTrack(index, shouldPlay){
    currentIndex = (index + MUSIC_TRACKS.length) % MUSIC_TRACKS.length;
    renderTrack();
    seek.value = "0";
    currentLabel.textContent = "0:00";
    durationLabel.textContent = "0:24";
    audio.src = createMusicTrackUrl(currentIndex);
    audio.load();
    if (shouldPlay) {
      var promise = audio.play();
      if (promise && promise.catch) promise.catch(renderPlaying);
    }
  }
  function togglePlayback(){
    if (!audio.src) setTrack(currentIndex,false);
    if (audio.paused) {
      var promise = audio.play();
      if (promise && promise.catch) promise.catch(renderPlaying);
    } else {
      audio.pause();
    }
  }

  audio.volume = Number(volume.value);
  setTrack(0,false);
  toggle.addEventListener("click",togglePlayback);
  root.querySelector('[data-music-action="previous"]').addEventListener("click",function(){ setTrack(currentIndex-1,true); });
  root.querySelector('[data-music-action="next"]').addEventListener("click",function(){ setTrack(currentIndex+1,true); });
  root.addEventListener("click",function(e){
    var trackButton = e.target.closest ? e.target.closest(".music-track[data-track]") : null;
    if (trackButton) setTrack(Number(trackButton.getAttribute("data-track")),true);
  });
  seek.addEventListener("input",function(){
    if (Number.isFinite(audio.duration) && audio.duration > 0) audio.currentTime = audio.duration * Number(seek.value) / 1000;
  });
  volume.addEventListener("input",function(){ audio.volume = Number(volume.value); });
  audio.addEventListener("loadedmetadata",function(){ durationLabel.textContent = formatMusicTime(audio.duration); });
  audio.addEventListener("timeupdate",function(){
    currentLabel.textContent = formatMusicTime(audio.currentTime);
    if (Number.isFinite(audio.duration) && audio.duration > 0) seek.value = String(Math.round(audio.currentTime / audio.duration * 1000));
  });
  audio.addEventListener("play",renderPlaying);
  audio.addEventListener("pause",renderPlaying);
  audio.addEventListener("ended",function(){ setTrack(currentIndex+1,true); });
  renderPlaying();
}

function attachIconDrag(btn){
  var layer = $("l-icons");
  btn.classList.toggle("popover-left", parseFloat(btn.style.left) > 620);
  btn.addEventListener("pointerdown", function(e){
    if (e.button !== 0 || !$("desktop-screen").classList.contains("os-live")) return;
    var layerRect = layer.getBoundingClientRect();
    var scale = layer.offsetWidth / layerRect.width;
    var startX = e.clientX, startY = e.clientY;
    var startLeft = parseFloat(btn.style.left) || 0;
    var startTop = parseFloat(btn.style.top) || 0;
    var moved = false;
    btn.setPointerCapture(e.pointerId);
    function drag(ev){
      var dx = (ev.clientX - startX) * scale;
      var dy = (ev.clientY - startY) * scale;
      if (!moved && Math.hypot(dx,dy) < 5) return;
      moved = true;
      btn.classList.add("dragging");
      var left = Math.max(0, Math.min(startLeft + dx, layer.clientWidth - btn.offsetWidth));
      var top = Math.max(0, Math.min(startTop + dy, layer.clientHeight - 66));
      btn.style.left = Math.round(left) + "px";
      btn.style.top = Math.round(top) + "px";
      btn.classList.toggle("popover-left", left > 620);
    }
    function drop(ev){
      btn.removeEventListener("pointermove", drag);
      btn.removeEventListener("pointerup", drop);
      btn.removeEventListener("pointercancel", drop);
      try{ btn.releasePointerCapture(ev.pointerId); }catch(err){}
      btn.classList.remove("dragging");
      if (!moved) return;
      btn.setAttribute("data-dragged","true");
      if (workspaceState === "home") {
        iconPositions[btn.getAttribute("data-id")] = {
          x:Math.round(parseFloat(btn.style.left) || 0),
          y:Math.round(parseFloat(btn.style.top) || 0)
        };
        writeLocal(ICON_STORAGE_KEY, iconPositions);
      }
      setTimeout(function(){ btn.removeAttribute("data-dragged"); }, 0);
    }
    btn.addEventListener("pointermove", drag);
    btn.addEventListener("pointerup", drop);
    btn.addEventListener("pointercancel", drop);
  });
}

var deskObjectPositions = readLocal(DESK_OBJECT_STORAGE_KEY,{});
function deskObjectVisualBounds(el){
  var nodes = [el].concat([].slice.call(el.querySelectorAll("*")));
  var left = Infinity, right = -Infinity;
  for (var i=0;i<nodes.length;i++){
    var rect = nodes[i].getBoundingClientRect();
    if (!rect.width && !rect.height) continue;
    left = Math.min(left,rect.left);
    right = Math.max(right,rect.right);
  }
  return {left:left,right:right};
}
function setDeskObjectOffset(el,value){
  el.style.setProperty("--desk-object-x",Math.round(value)+"px");
  el.setAttribute("data-desk-x",String(Math.round(value)));
  /* 猫要跟着道具重新定位，这里是位置变化的唯一出口 */
  try{ document.dispatchEvent(new CustomEvent("hatari:deskobject")); }catch(err){}
}
function clampDeskObjectOffset(el,desired,current){
  var bounds = deskObjectVisualBounds(el);
  var slotRect = slot.getBoundingClientRect();
  var min = current + slotRect.left + 10 - bounds.left;
  var max = current + slotRect.right - 10 - bounds.right;
  return Math.max(min,Math.min(max,desired));
}
function persistDeskObject(el){
  var id = el.getAttribute("data-desk-object");
  deskObjectPositions[id] = Number(el.getAttribute("data-desk-x")) || 0;
  writeLocal(DESK_OBJECT_STORAGE_KEY,deskObjectPositions);
}
function attachDeskObjectDrag(el){
  var id = el.getAttribute("data-desk-object");
  var saved = Number(deskObjectPositions[id]);
  setDeskObjectOffset(el,Number.isFinite(saved) ? saved : 0);
  el.addEventListener("pointerdown",function(e){
    if (e.button !== 0 || workspaceState !== "home") return;
    var startPointer = e.clientX;
    var startOffset = Number(el.getAttribute("data-desk-x")) || 0;
    var moved = false;
    el.setPointerCapture(e.pointerId);
    function drag(ev){
      var desired = startOffset + ev.clientX - startPointer;
      if (!moved && Math.abs(desired-startOffset) < 4) return;
      moved = true;
      el.classList.add("dragging");
      setDeskObjectOffset(el,clampDeskObjectOffset(el,desired,Number(el.getAttribute("data-desk-x")) || 0));
    }
    function drop(ev){
      el.removeEventListener("pointermove",drag);
      el.removeEventListener("pointerup",drop);
      el.removeEventListener("pointercancel",drop);
      try{ el.releasePointerCapture(ev.pointerId); }catch(err){}
      el.classList.remove("dragging");
      if (!moved) return;
      el.setAttribute("data-dragged","true");
      persistDeskObject(el);
      setTimeout(function(){ el.removeAttribute("data-dragged"); },0);
    }
    el.addEventListener("pointermove",drag);
    el.addEventListener("pointerup",drop);
    el.addEventListener("pointercancel",drop);
  });
  el.addEventListener("keydown",function(e){
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    var current = Number(el.getAttribute("data-desk-x")) || 0;
    var desired = current + (e.key === "ArrowLeft" ? -14 : 14);
    setDeskObjectOffset(el,clampDeskObjectOffset(el,desired,current));
    persistDeskObject(el);
  });
}

function resetDockMagnification(){

    btn.style.setProperty("--dock-lift","0px");
  });

function magnifyDock(e){
  if (reduce || e.pointerType === "touch") return;
  dockButtonsAll.forEach(function(btn){
    var rect = btn.getBoundingClientRect();
    var distance = Math.abs(e.clientX - (rect.left + rect.width / 2));
    var influence = Math.max(0, 1 - distance / 82);
    btn.style.setProperty("--dock-scale",(1 + influence * .16).toFixed(3));
    btn.style.setProperty("--dock-lift",(-influence * 7).toFixed(2)+"px");
  });
}

  var statusMessagesEn = [
    "[sync] Workspace state saved",
    "[helper] Local knowledge is ready",
    "[idle] Site helper is waiting",
    "[log] Work memory is organized"
  ];

  function paint(isDone){
    var html = "";
    for (var i=0;i<terminalScript.length;i++){
      var e = terminalScript[i];
      var sourceText = homeLanguage === "en" && e.textEn ? e.textEn : e.text;
      var txt = isDone || i < line ? sourceText : (i === line ? sourceText.slice(0, chars) : null);
      if (txt === null) continue;
      html += '<p class="p'+e.kind+'">'+(txt || " ")+"</p>";
    }
    if (isDone) {
      html += '<p class="p2 status">'+(statusText || " ")+'</p>';
      html += '<p class="p1">$<span class="caret"></span></p>';
    }
    body.innerHTML = html;
  }

  document.addEventListener("hatari:languagechange",function(){
    var messages = homeLanguage === "en" ? statusMessagesEn : statusMessagesZh;
    statusText = messages[Math.max(0,statusIndex - 1) % messages.length];
    paint(done || reduce);
  });

  if (reduce) { paint(true); return; }

  function scheduleStatus(){
    setTimeout(function(){
      var messages = homeLanguage === "en" ? statusMessagesEn : statusMessagesZh;
      statusText = messages[statusIndex++ % messages.length];
      paint(true);
      scheduleStatus();
    }, 7800 + Math.random() * 5200);
  }

  function finishTerminal(){
    if (done) return;
    done = true;
    paint(true);
    scheduleStatus();
  }

  paint(false);
  function step(){
    var e = terminalScript[line];
    if (!e) { finishTerminal(); return; }
    var atStart = chars === 0;
    var delay = atStart ? 340 : (e.kind === 1 ? 62 : 26);
    setTimeout(function(){
      if (chars < e.text.length) { chars++; }
      else { line++; chars = 0; }
      if (line >= terminalScript.length) { finishTerminal(); return; }
      paint(false); step();
    }, delay);
  }

  // The terminal starts only after the workspace has finished restoring.
  function startTerminal(){ setTimeout(step, 360); }
  if ($("desktop-screen").classList.contains("os-live")) startTerminal();
  else document.addEventListener("workspace:live", startTerminal, { once: true });
})();

/* ============================================================
   适配缩放：桌面按固定 960x680 布局，再整体缩放
   ============================================================ */
var BASE_W = 960, BASE_H = 680;      // 屏幕（含机身边框）
var STAND_H = 58;                    // 支架：颈 + 底座
var ASSEMBLY_H = BASE_H + STAND_H;   // 738
var SLOT_RATIO_DESKTOP = 0.88;       // 桌面端为两栏建立接近一致的上下边界
var SLOT_RATIO_COMPACT = 0.74;       // 窄屏保持原有的紧凑场景比例
var REST_INSET = 0.88;               // 静止时整机留白，读起来像一台放在桌上的显示器
var slot = $("slot"), scaler = $("scaler");
var restT = "", zoomT = "", zoomed = false, lastW = -1, lastRatio = -1;

function fit(){
  if (workspaceState !== "home") return;
  var W = Math.round(slot.getBoundingClientRect().width);
  var slotRatio = window.innerWidth >= 1024 ? SLOT_RATIO_DESKTOP : SLOT_RATIO_COMPACT;
  if (W === lastW && slotRatio === lastRatio) return; // 下面会改 height，避免 RO 自激
  lastW = W;
  lastRatio = slotRatio;

  var H = Math.round(W * slotRatio);
  slot.style.height = H + "px";

  // 静止：整机（含支架）缩到容器内，四周留白
  var sRest = Math.min(W / BASE_W, H / ASSEMBLY_H) * REST_INSET;
  // 悬停只轻微靠近，文件与窗口始终留在同一稳定构图中。
  var sZoom = sRest * 1.025;
  var sceneShift = window.innerWidth >= 1024 ? Math.min(34, W * .028) : 0;

  var restX = Math.round((W - BASE_W * sRest) / 2 - sceneShift);
  var restY = Math.round((H - ASSEMBLY_H * sRest) / 2);
  var zoomX = Math.round((W - BASE_W * sZoom) / 2 - sceneShift);
  var zoomY = Math.round((H - ASSEMBLY_H * sZoom) / 2 - 3);

  restT = "translate(" + restX + "px," + restY + "px) scale(" + sRest.toFixed(4) + ")";
  zoomT = "translate(" + zoomX + "px," + zoomY + "px) scale(" + sZoom.toFixed(4) + ")";
  scaler.style.transform = zoomed ? zoomT : restT;
}
fit();
if (window.ResizeObserver) new ResizeObserver(fit).observe(slot);
else window.addEventListener("resize", fit);

/* 推近 / 拉远。触屏没有 hover，保持静止状态。 */
var canHover = !window.matchMedia || window.matchMedia("(hover: hover)").matches;
if (canHover) {
  $("machine").addEventListener("pointerenter", function(e){
    if (e.pointerType === "touch" || workspaceState !== "home") return;
    zoomed = true; slot.classList.add("zoom"); scaler.style.transform = zoomT;
  });
  $("machine").addEventListener("pointerleave", function(){
    if (workspaceState !== "home") return;
    zoomed = false; slot.classList.remove("zoom"); scaler.style.transform = restT;
    reset();
  });
}

/* ============================================================
   视差
   ============================================================ */
var layers = [
  [$("l-wall"),    8,   6],
  [$("l-icons"),  -4,  -3],
  [$("l-win"),    -6,  -4],
  [$("l-term"),   -8,  -6],
  [$("l-dock"),   -3,   0]
];

function move(e){
  if (reduce) return;
  var r = $("machine").getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width - 0.5;
  var y = (e.clientY - r.top) / r.height - 0.5;
  $("desktop-screen").style.setProperty("--reflection-x",((x + .5) * 42 + 51).toFixed(1)+"%");
  $("desktop-screen").style.setProperty("--reflection-y",((y + .5) * 28 + 4).toFixed(1)+"%");
  for (var i=0;i<layers.length;i++)
    layers[i][0].style.translate = (x*layers[i][1]).toFixed(2)+"px "+(y*layers[i][2]).toFixed(2)+"px";
}
function reset(){
  $("desktop-screen").style.setProperty("--reflection-x","74%");
  $("desktop-screen").style.setProperty("--reflection-y","16%");
  for (var i=0;i<layers.length;i++) layers[i][0].style.translate = "0px 0px";
}
$("machine").addEventListener("pointermove", move);
$("machine").addEventListener("pointerleave", reset);

/* ============================================================
   Spatial transition: monitor -> full workspace -> monitor
   ============================================================ */
var workspacePortal = $("workspace-portal");
var workspaceExit = $("workspace-exit");
var workspaceNav = $("workspace-nav");
var workspaceHome = $("workspace-home");
var workspaceAbout = $("workspace-about");
var workspaceSourceRect = null;
var workspaceTrigger = null;
var workspaceRequestedApp = null;
var workspaceFocusExit = false;
var workspaceHistoryPushed = false;
var lockedScrollY = 0;
var lockedBodyStyles = null;

function afterTransform(el,duration,callback){
  var finished = false;
  function complete(){
    if (finished) return;
    finished = true;
    el.removeEventListener("transitionend",onEnd);
    callback();
  }
  function onEnd(e){
    if (e.target === el && e.propertyName === "transform") complete();
  }
  el.addEventListener("transitionend",onEnd);
  setTimeout(complete,duration + 90);
}

function positionWindowForWorkspace(wrap, animate){
  if (!wrap || wrap.hidden || workspaceState !== "live" || window.innerWidth <= 720) return;
  var screen = $("desktop-screen");
  var width = wrap.offsetWidth || 420;
  var height = wrap.offsetHeight || 320;
  var left = Math.max(226, Math.round((screen.clientWidth - width) / 2));
  var top = Math.max(58, Math.round((screen.clientHeight - height) / 2 - 20));
  if (animate) {
    wrap.style.transition = "left .36s cubic-bezier(.22,1,.36,1),top .36s cubic-bezier(.22,1,.36,1)";
    setTimeout(function(){
      if (wrap.isConnected) wrap.style.transition = "";
    }, 390);
  }
  wrap.style.left = left + "px";
  wrap.style.top = top + "px";
}

function snapshotHomeWorkspace(){
  workspaceHomeWindowLayout = {};
  Object.keys(openWindows).forEach(function(id){
    var wrap = openWindows[id];
    var d = WINDOW_DEFAULTS[id];
    workspaceHomeWindowLayout[id] = {
      x:Number.isFinite(parseFloat(wrap.style.left)) ? parseFloat(wrap.style.left) : d.x,
      y:Number.isFinite(parseFloat(wrap.style.top)) ? parseFloat(wrap.style.top) : d.y,
      w:Number.isFinite(parseFloat(wrap.style.width)) ? parseFloat(wrap.style.width) : d.w
    };
  });
  workspaceHomeIconLayout = {};
  var icons = document.querySelectorAll(".di");
  for (var i=0;i<icons.length;i++) {
    workspaceHomeIconLayout[icons[i].getAttribute("data-id")] = {
      x:parseFloat(icons[i].style.left) || 0,
      y:parseFloat(icons[i].style.top) || 0
    };
  }
}

function restoreHomeWorkspace(animate){
  Object.keys(openWindows).forEach(function(id){
    var wrap = openWindows[id];
    var d = WINDOW_DEFAULTS[id];
    var saved = workspaceHomeWindowLayout[id] || d;
    if (animate) {
      wrap.style.transition = "left .22s cubic-bezier(.22,1,.36,1),top .22s cubic-bezier(.22,1,.36,1),width .22s cubic-bezier(.22,1,.36,1)";
    }
    wrap.style.left = saved.x + "px";
    wrap.style.top = saved.y + "px";
    wrap.style.width = saved.w + "px";
  });
  var icons = document.querySelectorAll(".di");
  for (var i=0;i<icons.length;i++) {
    var savedIcon = workspaceHomeIconLayout[icons[i].getAttribute("data-id")];
    if (!savedIcon) continue;
    if (animate) icons[i].style.transition = "left .22s cubic-bezier(.22,1,.36,1),top .22s cubic-bezier(.22,1,.36,1)";
    icons[i].style.left = savedIcon.x + "px";
    icons[i].style.top = savedIcon.y + "px";
  }
  if (animate) {
    setTimeout(function(){
      Object.keys(openWindows).forEach(function(id){
        if (openWindows[id].isConnected) openWindows[id].style.transition = "";
      });
      var desktopIcons = document.querySelectorAll(".di");
      for (var j=0;j<desktopIcons.length;j++) desktopIcons[j].style.transition = "";
    }, 260);
  }
}

function lockHomePage(){
  lockedScrollY = window.scrollY || 0;
  lockedBodyStyles = {
    position:document.body.style.position,
    top:document.body.style.top,
    left:document.body.style.left,
    right:document.body.style.right,
    width:document.body.style.width,
    paddingRight:document.body.style.paddingRight
  };
  var scrollbar = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
  document.body.style.position = "fixed";
  document.body.style.top = (-lockedScrollY) + "px";
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.width = "100%";
  if (scrollbar) document.body.style.paddingRight = scrollbar + "px";
}

function unlockHomePage(){
  if (!lockedBodyStyles) return;
  document.body.style.position = lockedBodyStyles.position;
  document.body.style.top = lockedBodyStyles.top;
  document.body.style.left = lockedBodyStyles.left;
  document.body.style.right = lockedBodyStyles.right;
  document.body.style.width = lockedBodyStyles.width;
  document.body.style.paddingRight = lockedBodyStyles.paddingRight;
  window.scrollTo(0, lockedScrollY);
  lockedBodyStyles = null;
}

function setHomeInert(value){
  var home = [document.querySelector(".hdr"), document.querySelector("main"), document.querySelector(".ftr")];
  for (var i=0;i<home.length;i++) if (home[i]) home[i].inert = value;
}

function getWorkspaceCoverTransform(){
  var screenWidth = BASE_W - 22;
  var screenHeight = BASE_H - 22;
  var scale = Math.max(window.innerWidth / screenWidth, window.innerHeight / screenHeight) * 1.012;
  var x = (window.innerWidth - screenWidth * scale) / 2 - 11 * scale;
  var y = (window.innerHeight - screenHeight * scale) / 2 - 11 * scale;
  return "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + scale.toFixed(5) + ")";
}

function getHomeMachineRect(){
  var rect = slot.getBoundingClientRect();
  var width = Math.round(rect.width);
  var slotRatio = window.innerWidth >= 1024 ? SLOT_RATIO_DESKTOP : SLOT_RATIO_COMPACT;
  var height = Math.round(width * slotRatio);
  var scale = Math.min(width / BASE_W, height / ASSEMBLY_H) * REST_INSET;
  var shift = window.innerWidth >= 1024 ? Math.min(34, width * .028) : 0;
  return {
    left:rect.left + (width - BASE_W * scale) / 2 - shift,
    top:rect.top + (height - ASSEMBLY_H * scale) / 2,
    width:BASE_W * scale,
    height:ASSEMBLY_H * scale
  };
}

function workspaceAppFromTarget(target){
  if (!target || !target.closest) return null;
  var icon = target.closest(".di");
  if (icon) return icon.getAttribute("data-id");
  var win = target.closest(".winwrap");
  if (win) return win.getAttribute("data-window");
  var dockApp = target.closest(".dapp[data-app]");
  if (dockApp) return DOCK_TO_APP[dockApp.getAttribute("data-app")] || null;
  if (target.closest("#agent-status")) return "agents";
  return null;
}

function activeWorkspaceWindow(){
  var active = null;
  Object.keys(openWindows).forEach(function(id){
    var wrap = openWindows[id];
    if (!wrap.hidden && wrap.classList.contains("is-active")) active = wrap;
  });
  return active;
}

function settleFullWorkspace(){
  var target = null;
  if (workspaceRequestedApp) target = openWindow(workspaceRequestedApp);
  if (!target) target = activeWorkspaceWindow();
  if (target) {
    focusWindow(target);
    positionWindowForWorkspace(target, true);
  }
}

function activateFullWorkspace(){
  workspaceState = "live";
  scaler.style.transition = "none";
  document.body.classList.add("workspace-live");
  document.body.classList.remove("workspace-entering");
  scaler.style.position = "";
  scaler.style.left = "";
  scaler.style.top = "";
  scaler.style.width = "";
  scaler.style.height = "";
  scaler.style.transform = "";
  scaler.style.opacity = "";
  workspacePortal.classList.add("settling");
  requestAnimationFrame(function(){ scaler.style.transition = ""; });
  $("desktop-screen").setAttribute("aria-label","Hatari 的人工智能工作台");
  $("desktop-screen").tabIndex = -1;
  setHomeInert(true);
  requestAnimationFrame(settleFullWorkspace);
  setTimeout(function(){ workspacePortal.classList.remove("settling"); }, 270);
  if (workspaceFocusExit) {
    setTimeout(function(){ workspaceHome.focus({preventScroll:true}); }, 80);
  }
}

function pushWorkspaceHistory(){
  if (location.hash === "#workspace" && history.state && history.state.hatariWorkspace) return;
  history.pushState({hatariWorkspace:true},"",location.href.split("#")[0] + "#workspace");
  workspaceHistoryPushed = true;
}

function enterWorkspace(appId, fromHistory, focusExit){
  if (workspaceState !== "home") return;
  workspaceState = "entering";
  workspaceRequestedApp = appId || null;
  workspaceFocusExit = !!focusExit;
  workspaceTrigger = document.activeElement;
  workspaceSourceRect = $("machine").getBoundingClientRect();
  snapshotHomeWorkspace();
  zoomed = false;
  slot.classList.remove("zoom");
  slot.classList.add("workspace-host");
  reset();
  lockHomePage();

  workspacePortal.classList.add("active");
  workspacePortal.setAttribute("aria-hidden","false");
  workspaceNav.hidden = false;
  workspaceExit.hidden = false;
  workspaceExit.tabIndex = -1;
  workspacePortal.appendChild(scaler);
  scaler.style.position = "absolute";
  scaler.style.left = "0";
  scaler.style.top = "0";
  scaler.style.width = BASE_W + "px";
  scaler.style.height = ASSEMBLY_H + "px";
  scaler.style.transition = "none";
  scaler.style.opacity = "1";
  var sourceScale = workspaceSourceRect.width / BASE_W;
  scaler.style.transform = "translate(" + workspaceSourceRect.left.toFixed(2) + "px," +
    workspaceSourceRect.top.toFixed(2) + "px) scale(" + sourceScale.toFixed(5) + ")";
  scaler.getBoundingClientRect();

  if (!fromHistory) pushWorkspaceHistory();
  var compact = window.innerWidth < 720;
  requestAnimationFrame(function(){
    document.body.classList.add("workspace-entering");
    if (reduce || compact) {
      scaler.style.transition = reduce ? "none" : "opacity .24s ease";
      scaler.style.opacity = compact ? ".82" : "1";
      setTimeout(activateFullWorkspace, reduce ? 0 : 230);
      return;
    }
    scaler.style.transition = "transform .86s cubic-bezier(.2,.82,.2,1)";
    scaler.style.transform = getWorkspaceCoverTransform();
    afterTransform(scaler,860,activateFullWorkspace);
  });
}

function finishWorkspaceExit(){
  workspaceState = "home";
  document.body.classList.remove("workspace-exiting","workspace-entering","workspace-live");
  workspacePortal.classList.remove("active","settling");
  workspacePortal.setAttribute("aria-hidden","true");
  workspaceNav.hidden = true;
  slot.appendChild(scaler);
  slot.classList.remove("workspace-host","zoom");
  scaler.style.position = "";
  scaler.style.left = "";
  scaler.style.top = "";
  scaler.style.width = "";
  scaler.style.height = "";
  scaler.style.transition = "";
  scaler.style.transform = "";
  scaler.style.opacity = "";
  workspaceExit.hidden = true;
  workspaceExit.tabIndex = -1;
  workspaceExit.style.opacity = "";
  workspaceExit.style.pointerEvents = "";
  $("desktop-screen").setAttribute("aria-label","进入 Hatari 的人工智能工作台");
  $("desktop-screen").tabIndex = 0;
  setHomeInert(false);
  unlockHomePage();
  lastW = -1;
  fit();
  reset();
  saveSession();
  if (workspaceTrigger && workspaceTrigger.isConnected) {
    try{ workspaceTrigger.focus({preventScroll:true}); }catch(err){}
  }
  workspaceTrigger = null;
  workspaceRequestedApp = null;
}

function exitWorkspace(){
  if (workspaceState !== "live") return;
  workspaceState = "exiting";
  workspaceExit.style.opacity = "0";
  workspaceExit.style.pointerEvents = "none";
  restoreHomeWorkspace(!reduce);

  var compact = window.innerWidth < 720;
  if (reduce || compact) {
    document.body.classList.remove("workspace-live");
    document.body.classList.add("workspace-exiting");
    scaler.style.transition = reduce ? "none" : "opacity .24s ease";
    scaler.style.opacity = "0";
    setTimeout(finishWorkspaceExit, reduce ? 0 : 250);
    return;
  }

  workspaceSourceRect = getHomeMachineRect();
  scaler.style.position = "absolute";
  scaler.style.left = "0";
  scaler.style.top = "0";
  scaler.style.width = BASE_W + "px";
  scaler.style.height = ASSEMBLY_H + "px";
  scaler.style.transition = "none";
  scaler.style.transform = getWorkspaceCoverTransform();
  document.body.classList.remove("workspace-live");
  document.body.classList.add("workspace-exiting");
  scaler.getBoundingClientRect();
  requestAnimationFrame(function(){
    var scale = workspaceSourceRect.width / BASE_W;
    scaler.style.transition = "transform .78s cubic-bezier(.4,0,.2,1)";
    scaler.style.transform = "translate(" + workspaceSourceRect.left.toFixed(2) + "px," +
      workspaceSourceRect.top.toFixed(2) + "px) scale(" + scale.toFixed(5) + ")";
    afterTransform(scaler,780,finishWorkspaceExit);
  });
}

function requestWorkspaceExit(){
  if (workspaceState !== "live") return;
  if (workspaceHistoryPushed) {
    history.back();
    return;
  }
  history.replaceState(null,"",location.href.split("#")[0]);
  exitWorkspace();
}

$("desktop-screen").addEventListener("pointerdown", function(e){
  if (workspaceState === "home" && e.button === 0) e.stopPropagation();
}, true);
$("desktop-screen").addEventListener("click", function(e){
  if (workspaceState !== "home" || !$("desktop-screen").classList.contains("os-live")) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  enterWorkspace(workspaceAppFromTarget(e.target), false, e.detail === 0);
}, true);
$("desktop-screen").addEventListener("keydown", function(e){
  if (workspaceState !== "home" || !$("desktop-screen").classList.contains("os-live") ||
      e.target !== $("desktop-screen") || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  enterWorkspace(null, false, true);
});
workspaceExit.addEventListener("click", requestWorkspaceExit);
workspaceHome.addEventListener("click", requestWorkspaceExit);
workspaceAbout.addEventListener("click", function(){
  if (workspaceState !== "live") return;
  var aboutWindow = openWindow("about");
  if (!aboutWindow) return;
  focusWindow(aboutWindow);
  positionWindowForWorkspace(aboutWindow, true);
});
window.addEventListener("keydown", function(e){
  if (e.key === "Escape" && workspaceState === "live") {
    e.preventDefault();
    requestWorkspaceExit();
  }
});
window.addEventListener("popstate", function(){
  if (location.hash === "#workspace") {
    workspaceHistoryPushed = true;
    if (workspaceState === "home") enterWorkspace(null, true, false);
  } else if (workspaceState === "live") {
    workspaceHistoryPushed = false;
    exitWorkspace();
  }
});

if (location.hash === "#workspace") {
  history.replaceState({hatariWorkspace:true},"",location.href);
  workspaceHistoryPushed = false;
  document.addEventListener("workspace:live",function(){
    setTimeout(function(){ enterWorkspace(null, true, false); },80);
  },{once:true});
}

/* ============================================================
   Hero cat — two stages, real occlusion, graph-based movement
   ------------------------------------------------------------
   Landings are named points measured from live DOM rects. The cat
   only ever travels along the edges of a small graph, so it never
   dissolves in mid-air: it walks, hops, or bridges. Occlusion is
   real z-index, not a clip: #cat-stage-scene sits inside .slot
   between the desk (1), the monitor (3) and the props (5).
   ============================================================ */
(function(){
  var uiStage    = $("cat-stage-ui");
  var sceneStage = $("cat-stage-scene");
  var cat        = $("hatari-cat");
  var split      = document.querySelector(".split");
  if (!uiStage || !sceneStage || !cat || !split) return;

  var CAT_W = 80, CAT_H = 74;
  /* Distance from the box bottom up to the paws, per pose. These mirror the
     --cat-foot values in CSS; the two lists must change together. */
  var POSE_FOOT = {sit:5, walk:7.5, loaf:6, stretch:3.5, peek:2.5};

  /* depth  : z band inside the scene stage (back < mid < front)
     shadow : contact shadow opacity — 0 where the cat is occluded anyway
     pet    : only where nothing covers the cat, so the affordance is honest
     face   : which way it looks once it has settled
     scale  : size on the far/near plane. Monotonic in depth, so the cat
              is smallest on top of the monitor and largest at the desk edge. */
  var LANDINGS = {
    title:   {stage:"ui",    depth:"front", shadow:.14, pet:true,  face:1,  pose:"sit"},
    button:  {stage:"ui",    depth:"front", shadow:.20, pet:true,  face:1,  pose:"sit"},
    monitor: {stage:"scene", depth:"back",  shadow:0,   pet:false, face:-1, pose:"sit"},
    desk:    {stage:"scene", depth:"front", shadow:.34, pet:true,  face:-1, pose:"loaf"},
    plant:   {stage:"scene", depth:"mid",   shadow:0,   pet:false, face:1,  pose:"peek"},
    lamp:    {stage:"scene", depth:"mid",   shadow:.20, pet:false, face:-1, pose:"loaf"}
  };
  /* Every pair the cat can cross in one visible move. Anything else is routed. */
  var EDGES = {
    title:  ["button","monitor"],
    button: ["title"],
    monitor:["title","desk"],
    desk:   ["monitor","plant","lamp"],
    plant:  ["desk"],
    lamp:   ["desk"]
  };
  var WALK_PAIRS = {
    "desk>plant":1,"plant>desk":1,"desk>lamp":1,"lamp>desk":1
  };
  var SINK = .32;   /* how far the cat drops behind the monitor's top edge */

  var current = "lamp", facing = -1, lastPoint = null;
  var started = false, moving = false, parked = false;
  var compact = window.innerWidth <= 720;
  var dark = document.documentElement.classList.contains("dark");
  var anim = null, deskFrame = 0;
  var moveTimer = 0, introTimer = 0, resizeTimer = 0;
  var blinkTimer = 0, earTimer = 0, petTimer = 0, petCount = 0;

  function stageOf(name){ return LANDINGS[name].stage === "ui" ? uiStage : sceneStage; }
  function idle(){ return started && !moving && !parked && workspaceState === "home"; }

  /* ---------- measurement: everything in viewport coords ---------- */

  /* The monitor is the only part of the scene that resizes with the viewport,
     so the cat's size on it is derived from the bezel. The props (plant, lamp)
     are fixed-size, so their landings use fixed scales. */
  function monitorScale(){
    var w = document.querySelector(".bezel").getBoundingClientRect().width || 650;
    return Math.max(.4, Math.min(.7, .58 * w / 650));
  }

  function capMetrics(el, rect){
    var cs = getComputedStyle(el);
    var size = parseFloat(cs.fontSize) || 48;
    if (!capMetrics.ctx){
      var c = document.createElement("canvas");
      capMetrics.ctx = c.getContext ? c.getContext("2d") : null;
    }
    var ctx = capMetrics.ctx;
    if (!ctx) return {top:rect.top + size * .1, cap:size * .7};
    ctx.font = [cs.fontStyle, cs.fontWeight, cs.fontSize, cs.fontFamily].join(" ");
    var m = ctx.measureText("Hatari");
    var ascent  = m.fontBoundingBoxAscent  || size * .78;
    var descent = m.fontBoundingBoxDescent || size * .2;
    var actual  = m.actualBoundingBoxAscent || size * .7;
    var leading = Math.max(0, rect.height - ascent - descent);
    var baseline = rect.top + leading / 2 + ascent;
    return {top:baseline - actual, cap:actual};
  }

  /* For the monitor this returns the EDGE point: paws exactly on the bezel's
     top edge. The sink behind the edge happens on arrival. */
  function measure(name){
    var el, rect, cap, scale;
    if (name === "title"){
      el = $("title-perch") || $("t-head");
      rect = el.getBoundingClientRect();
      cap = capMetrics(el, rect);
      scale = Math.max(.4, Math.min(.9, cap.cap * 1.02 / CAT_H));
      return {vx:rect.left + rect.width * .62, vy:cap.top, scale:scale};
    }
    if (name === "button"){
      el = document.querySelector(".cta .btn") || document.querySelector(".cta .btn-o");
      rect = el.getBoundingClientRect();
      var intro = document.querySelector(".intro").getBoundingClientRect();
      scale = Math.max(.48, Math.min(.88, rect.height * 1.22 / CAT_H));
      return {
        vx:Math.min(intro.right - CAT_W * scale * .5 - 4, rect.right + 32),
        vy:rect.top + 2, scale:scale
      };
    }
    if (name === "monitor"){
      rect = document.querySelector(".bezel").getBoundingClientRect();
      scale = monitorScale();
      return {vx:rect.left + rect.width * .62, vy:rect.top, scale:scale};
    }
    if (name === "desk"){
      var slotRect = slot.getBoundingClientRect();
      rect = document.querySelector(".desk-surface").getBoundingClientRect();
      scale = .84;
      /* Low enough on the desk plane that the cat never covers the dock and
         cannot swallow clicks meant for the workspace. */
      return {
        vx:slotRect.left + slotRect.width * .72,
        vy:rect.top + rect.height * .62, scale:scale
      };
    }
    if (name === "plant"){
      el = $("desk-plant");
      rect = el.getBoundingClientRect();
      var pot = el.querySelector(".plant-pot").getBoundingClientRect();
      scale = .80;
      return {vx:rect.left + rect.width * .70, vy:pot.top + pot.height * .34, scale:scale};
    }
    el = $("desk-lamp").querySelector(".lamp-base");
    rect = el.getBoundingClientRect();
    scale = .78;
    return {vx:rect.left + rect.width * .64, vy:rect.top + 4, scale:scale};
  }

  function sunkPoint(edge){
    return {vx:edge.vx, vy:edge.vy + CAT_H * edge.scale * SINK, scale:edge.scale};
  }

  function local(point, stage){
    var box = stage.getBoundingClientRect();
    return {x:point.vx - box.left, y:point.vy - box.top, scale:point.scale};
  }

  /* transform-origin is 50% 100%, so scale keeps the box's bottom centre
     pinned. Offsetting by the pose's paw inset puts the paws — not the
     bottom of the bounding box — on the landing line. */
  function xform(p, pose, dir){
    var foot = POSE_FOOT[pose] || 5;
    var tx = p.x - CAT_W / 2;
    var ty = p.y - CAT_H + foot * p.scale;
    return "translate3d(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px,0) scale(" +
      (p.scale * dir).toFixed(4) + "," + p.scale.toFixed(4) + ")";
  }

  /* ---------- animation plumbing ---------- */

  function stop(){
    if (!anim) return;
    var held = "";
    try{ held = getComputedStyle(cat).transform; }catch(e){}
    anim.onfinish = null;
    try{ anim.cancel(); }catch(e){}
    anim = null;
    if (held && held !== "none") cat.style.transform = held;
  }

  function run(frames, options, done){
    stop();
    var last = frames[frames.length - 1];
    if (!cat.animate || parked){
      if (last.transform) cat.style.transform = last.transform;
      if (done) setTimeout(done, 0);
      return;
    }
    anim = cat.animate(frames, options);
    anim.onfinish = function(){
      if (last.transform) cat.style.transform = last.transform;
      anim.onfinish = null;
      try{ anim.cancel(); }catch(e){}
      anim = null;
      if (done) done();
    };
  }

  function setPose(pose){ cat.setAttribute("data-pose", pose); }

  function adopt(name){
    var stage = stageOf(name);
    if (cat.parentNode !== stage) stage.appendChild(cat);
    return stage;
  }

  /* Land: pose, depth, shadow and the petting affordance all settle here. */
  function finish(name, point, pose, done){
    current = name;
    lastPoint = point;
    var L = LANDINGS[name];
    var stage = adopt(name);
    if (stage === sceneStage) sceneStage.setAttribute("data-depth", L.depth);
    setPose(pose);
    cat.style.transform = xform(local(point, stage), pose, facing);
    cat.style.setProperty("--cat-shadow", String(L.shadow));
    var interactive = !!L.pet && !parked;
    cat.setAttribute("data-pettable", interactive ? "true" : "false");
    cat.tabIndex = interactive ? 0 : -1;
    cat.style.opacity = "1";
    if (done) done();
  }

  function restPose(name){
    if (name === "lamp") return dark ? "sit" : "loaf";
    if (name === "desk") return Math.random() < .45 ? "loaf" : "sit";
    return LANDINGS[name].pose;
  }

  function settle(name, point, dir, done){
    facing = dir;
    finish(name, point, restPose(name), function(){
      var want = LANDINGS[name].face;
      if (want !== facing && !parked){
        setTimeout(function(){ if (idle()) turn(want); }, 520);
      }
      if (done) done();
    });
  }

  /* A real turn, so walking left no longer plays the walk cycle backwards. */
  function turn(dir, done){
    if (dir === facing || parked || !cat.animate || !lastPoint){
      facing = dir;
      if (done) done();
      return;
    }
    var stage = cat.parentNode === sceneStage ? sceneStage : uiStage;
    var p = local(lastPoint, stage);
    var pose = cat.getAttribute("data-pose") || "sit";
    var from = facing;
    run([
      {transform:xform(p, pose, from)},
      {transform:xform(p, pose, from * .05)},
      {transform:xform(p, pose, dir)}
    ], {duration:230, easing:"ease-in-out", fill:"forwards"}, function(){
      facing = dir;
      if (done) done();
    });
  }

  /* ---------- the three ways it can move ---------- */

  function walkStep(name, target, done){
    var dir = target.vx >= lastPoint.vx ? 1 : -1;
    turn(dir, function(){
      var stage = adopt(name);
      var from = local(lastPoint, stage), to = local(target, stage);
      setPose("walk");
      var dist = Math.abs(to.x - from.x) + Math.abs(to.y - from.y);
      run([
        {transform:xform(from, "walk", dir)},
        {transform:xform(to, "walk", dir)}
      ], {duration:Math.max(1100, Math.min(2800, dist * 8)), easing:"linear", fill:"forwards"},
      function(){ settle(name, target, dir, done); });
    });
  }

  function hopStep(name, target, done){
    var dir = target.vx >= lastPoint.vx ? 1 : -1;
    turn(dir, function(){
      var stage = adopt(name);
      /* Coming forward is safe immediately; going behind waits for the landing. */
      if (stage === sceneStage){
        var order = {back:0, mid:1, front:2};
        var here = sceneStage.getAttribute("data-depth") || "mid";
        if (order[LANDINGS[name].depth] > order[here]) {
          sceneStage.setAttribute("data-depth", LANDINGS[name].depth);
        }
      }
      var from = local(lastPoint, stage), to = local(target, stage);
      var lift = Math.max(28, Math.abs(to.y - from.y) * .34 + 22);
      var apex = {
        x:(from.x + to.x) / 2,
        y:Math.min(from.y, to.y) - lift,
        scale:(from.scale + to.scale) / 2
      };
      setPose("stretch");
      run([
        {transform:xform(from, "stretch", dir), offset:0, easing:"cubic-bezier(.3,0,.7,.5)"},
        {transform:xform(apex, "stretch", dir), offset:.5, easing:"cubic-bezier(.3,.5,.7,1)"},
        {transform:xform(to, "stretch", dir), offset:1}
      ], {duration:880, fill:"forwards"},
      function(){ settle(name, target, dir, done); });
    });
  }

  /* The showpiece: title <-> monitor. Always played in the UI stage, the only
     stage .slot's overflow:hidden does not clip. */
  function bridgeStep(name, target, done){
    var dir = target.vx >= lastPoint.vx ? 1 : -1;
    turn(dir, function(){
      if (cat.parentNode !== uiStage) uiStage.appendChild(cat);
      var from = local(lastPoint, uiStage), to = local(target, uiStage);
      var span = Math.abs(to.x - from.x);
      var mid = {
        x:from.x + (to.x - from.x) * .60,
        y:from.y + (to.y - from.y) * .40,
        scale:from.scale + (to.scale - from.scale) * .55
      };
      var apex = {
        x:to.x - dir * Math.min(74, span * .17),
        y:Math.min(from.y, to.y) - 36,
        scale:to.scale
      };
      setPose("walk");
      run([
        {transform:xform(from, "walk", dir), offset:0},
        {transform:xform(mid, "walk", dir), offset:.56, easing:"cubic-bezier(.4,0,.6,1)"},
        {transform:xform(apex, "walk", dir), offset:.80, easing:"cubic-bezier(.3,.6,.7,1)"},
        {transform:xform(to, "walk", dir), offset:1}
      ], {duration:2400, easing:"linear", fill:"forwards"}, function(){
        lastPoint = target;
        facing = dir;
        if (name === "monitor") done();
        else settle(name, target, dir, done);
      });
    });
  }

  /* Arriving on the monitor: hand over to the scene stage at the exact same
     viewport point (so nothing jumps), then sink so the paws slide behind
     the bezel's top edge. That hidden third is where the realism comes from. */
  function sinkIn(edge, done){
    var sunk = sunkPoint(edge);
    if (cat.parentNode !== sceneStage) sceneStage.appendChild(cat);
    sceneStage.setAttribute("data-depth", LANDINGS.monitor.depth);
    setPose("sit");
    cat.style.transform = xform(local(edge, sceneStage), "sit", facing);
    run([
      {transform:xform(local(edge, sceneStage), "sit", facing)},
      {transform:xform(local(sunk, sceneStage), "sit", facing)}
    ], {duration:440, easing:"cubic-bezier(.3,0,.4,1)", fill:"forwards"},
    function(){ settle("monitor", sunk, facing, done); });
  }

  /* Leaving the monitor: rise back to the edge first, still behind the bezel,
     so the paws emerge instead of popping into view. */
  function liftOut(done){
    var edge = measure("monitor");
    var stage = sceneStage;
    if (cat.parentNode !== stage) stage.appendChild(cat);
    setPose("sit");
    run([
      {transform:xform(local(lastPoint, stage), "sit", facing)},
      {transform:xform(local(edge, stage), "sit", facing)}
    ], {duration:360, easing:"cubic-bezier(.2,.8,.3,1)", fill:"forwards"}, function(){
      lastPoint = edge;
      done();
    });
  }

  function step(name, done){
    var pair = current + ">" + name;
    var bridge = (pair === "title>monitor" || pair === "monitor>title");
    function go(){
      var target = measure(name);
      if (name === "monitor"){
        var arrive = bridge ? bridgeStep : hopStep;
        arrive("monitor", target, function(){ sinkIn(target, done); });
        return;
      }
      if (bridge) bridgeStep(name, target, done);
      else if (WALK_PAIRS[pair]) walkStep(name, target, done);
      else hopStep(name, target, done);
    }
    if (current === "monitor") liftOut(go);
    else go();
  }

  /* ---------- routing: no teleports, ever ---------- */

  function route(from, to){
    if (from === to) return [];
    var prev = {}, seen = {}, queue = [from], node, next, i;
    seen[from] = true;
    while (queue.length){
      node = queue.shift();
      if (node === to) break;
      next = EDGES[node] || [];
      for (i = 0; i < next.length; i++){
        if (seen[next[i]]) continue;
        seen[next[i]] = true;
        prev[next[i]] = node;
        queue.push(next[i]);
      }
    }
    if (!seen[to]) return [];
    var path = [], c = to;
    while (c !== from){ path.unshift(c); c = prev[c]; }
    return path;
  }

  function travel(to, done){
    if (!started || moving || parked || !LANDINGS[to]){ if (done) done(); return; }
    var path = route(current, to);
    if (!path.length){ if (done) done(); return; }
    moving = true;
    (function next(i){
      if (i >= path.length){
        moving = false;
        if (done) done();
        return;
      }
      step(path[i], function(){ next(i + 1); });
    })(0);
  }

  /* Cats wander to nearby spots, so weight the choice by graph distance. */
  function pickNext(){
    var pool = [], name, d, w;
    for (name in LANDINGS){
      if (name === current) continue;
      d = route(current, name).length;
      if (!d) continue;
      w = d === 1 ? 6 : (d === 2 ? 2 : 1);
      while (w--) pool.push(name);
    }
    return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  }

  /* ---------- small life ---------- */

  function twitchEars(){
    cat.classList.add("ear-twitch");
    setTimeout(function(){ cat.classList.remove("ear-twitch"); }, 520);
  }

  function postureMoment(){
    if (!lastPoint) return;
    if (current === "plant"){ twitchEars(); return; }
    var pose = cat.getAttribute("data-pose");
    var next = restPose(current);
    if (current === "title" || current === "button" || current === "monitor") next = "sit";
    if (next === pose) next = pose === "loaf" ? "sit" : "loaf";
    if (next === pose){ twitchEars(); return; }
    finish(current, lastPoint, next);
  }

  function scheduleNext(){
    clearTimeout(moveTimer);
    if (!started || parked) return;
    moveTimer = setTimeout(function(){
      if (document.hidden || workspaceState !== "home" || moving){ scheduleNext(); return; }
      if (Math.random() < .55){ postureMoment(); scheduleNext(); return; }
      var next = pickNext();
      if (!next){ scheduleNext(); return; }
      travel(next, scheduleNext);
    }, 18000 + Math.random() * 27000);
  }

  /* A scripted opening, so a visitor who stays 30 seconds actually sees the
     walk, the sink behind the monitor and the bridge across to the title. */
  var INTRO = ["desk","monitor","title"];
  function runIntro(i){
    clearTimeout(introTimer);
    if (i >= INTRO.length){ scheduleNext(); return; }
    introTimer = setTimeout(function(){
      if (!started || parked){ scheduleNext(); return; }
      if (document.hidden || workspaceState !== "home" || moving){ runIntro(i); return; }
      travel(INTRO[i], function(){ runIntro(i + 1); });
    }, i === 0 ? 9000 : 7600);
  }

  function loopBlink(){
    clearTimeout(blinkTimer);
    if (!started || parked || document.hidden) return;
    blinkTimer = setTimeout(function(){
      if (started && !parked && !document.hidden){
        cat.classList.add("blink");
        setTimeout(function(){ cat.classList.remove("blink"); }, 150);
      }
      loopBlink();
    }, 2600 + Math.random() * 4700);
  }

  function loopEars(){
    clearTimeout(earTimer);
    if (!started || parked || document.hidden) return;
    earTimer = setTimeout(function(){
      if (idle()) twitchEars();
      loopEars();
    }, 5200 + Math.random() * 9000);
  }

  /* ---------- lifecycle ---------- */

  function park(){
    parked = true;
    moving = false;
    clearTimeout(moveTimer);
    clearTimeout(introTimer);
    clearTimeout(blinkTimer);
    clearTimeout(earTimer);
    stop();
    facing = LANDINGS.desk.face;
    finish("desk", measure("desk"), "loaf");
  }

  function reflow(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (!started) return;
      var wasParked = parked;
      compact = window.innerWidth <= 720;
      parked = reduce || compact;
      if (moving){ stop(); moving = false; }
      if (parked){ park(); return; }
      if (wasParked){
        current = dark ? "monitor" : "lamp";
        facing = LANDINGS[current].face;
        if (current === "monitor") finish("monitor", sunkPoint(measure("monitor")), "sit");
        else finish(current, measure(current), restPose(current));
        loopBlink(); loopEars(); scheduleNext();
        return;
      }
      var pose = cat.getAttribute("data-pose") || restPose(current);
      var point = current === "monitor" ? sunkPoint(measure("monitor")) : measure(current);
      finish(current, point, pose);
    }, 90);
  }

  function start(){
    if (started) return;
    started = true;
    compact = window.innerWidth <= 720;
    parked = reduce || compact;
    if (parked){ park(); return; }
    current = "lamp";
    facing = LANDINGS.lamp.face;
    finish("lamp", measure("lamp"), dark ? "sit" : "loaf");
    loopBlink();
    loopEars();
    runIntro(0);
  }

  cat.addEventListener("click", function(){
    if (parked || moving || cat.getAttribute("data-pettable") !== "true") return;
    petCount++;
    clearTimeout(petTimer);
    cat.classList.remove("petted");
    void cat.offsetWidth;
    cat.classList.add("petted");
    petTimer = setTimeout(function(){ cat.classList.remove("petted"); }, 980);
    /* Four pets and it has had enough. Cats leave. */
    if (petCount % 4 === 0){
      clearTimeout(moveTimer);
      setTimeout(function(){
        if (!idle()) return;
        var next = pickNext();
        if (next) travel(next, scheduleNext); else scheduleNext();
      }, 620);
    }
  });

  document.addEventListener("hatari:theme", function(e){
    dark = !!(e.detail && e.detail.dark);
    if (!started || parked || moving) return;
    clearTimeout(moveTimer);
    if (dark){
      /* lamp off — it wakes up */
      if (current === "lamp" && lastPoint) finish("lamp", lastPoint, "sit");
      scheduleNext();
    } else {
      /* lamp on — back to the warm spot */
      travel("lamp", function(){
        if (lastPoint) finish("lamp", lastPoint, "loaf");
        scheduleNext();
      });
    }
  });

  /* The props are draggable, so re-measure when they actually move —
     one rAF per change instead of a rect read on every pointermove. */
  document.addEventListener("hatari:deskobject", function(){
    if (!idle() || deskFrame) return;
    if (current !== "plant" && current !== "lamp") return;
    deskFrame = requestAnimationFrame(function(){
      deskFrame = 0;
      if (!idle() || !lastPoint) return;
      finish(current, measure(current), cat.getAttribute("data-pose") || restPose(current));
    });
  });

  document.addEventListener("visibilitychange", function(){
    if (document.hidden){
      clearTimeout(blinkTimer);
      clearTimeout(earTimer);
      clearTimeout(moveTimer);
      return;
    }
    loopBlink();
    loopEars();
    if (started && !parked && !moving) scheduleNext();
  });

  window.addEventListener("resize", reflow, {passive:true});
  if (window.ResizeObserver) new ResizeObserver(reflow).observe(split);

  window.__hatariCat = {
    landings:Object.keys(LANDINGS),
    moveTo:function(name){ clearTimeout(moveTimer); clearTimeout(introTimer); travel(name, scheduleNext); },
    pet:function(){ cat.click(); },
    state:function(){
      return {
        landing:current,
        pose:cat.getAttribute("data-pose"),
        facing:facing,
        depth:sceneStage.getAttribute("data-depth"),
        stage:cat.parentNode === sceneStage ? "scene" : "ui",
        moving:moving,
        parked:parked
      };
    }
  };

  if (document.documentElement.classList.contains("hero-ready")) start();
  else document.addEventListener("hero:ready", start, {once:true});
})();

/* Scroll depth stays intentionally small so the page still feels settled. */
(function(){
  var ticking = false;
  function applyScrollDepth(){
    ticking = false;
    var enabled = !reduce && window.innerWidth >= 760;
    var y = enabled ? Math.min(Math.max(window.scrollY || 0,0),360) : 0;
    document.documentElement.style.setProperty("--scroll-title",(-y * .014).toFixed(2)+"px");
    document.documentElement.style.setProperty("--scroll-lede",(-y * .024).toFixed(2)+"px");
    document.documentElement.style.setProperty("--scroll-copy",(-y * .032).toFixed(2)+"px");
    document.documentElement.style.setProperty("--scroll-detail",(-y * .043).toFixed(2)+"px");
    document.documentElement.style.setProperty("--scroll-workspace",(y * .018).toFixed(2)+"px");
  }
  function queueScrollDepth(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(applyScrollDepth);
  }
  applyScrollDepth();
  window.addEventListener("scroll",queueScrollDepth,{passive:true});
  window.addEventListener("resize",queueScrollDepth,{passive:true});
})();

   上海时钟

(function(){
  var el = $("clock");
  function tick(){
    try{
      el.textContent = new Intl.DateTimeFormat("en-US",{
        timeZone:"Asia/Shanghai", hour:"numeric", minute:"2-digit", hour12:true
      }).format(new Date());
    }catch(err){ /* 环境不支持时区就保留占位 */ }
  }
  tick(); setInterval(tick, 15000);
})();

/* ============================================================
   主题切换：导航按钮与实体台灯共享同一状态

(function(){

  var dark = document.documentElement.classList.contains("dark");
  var sun  = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"/></svg>';
  var moon = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></svg>';

  function renderTheme(){

    btn.innerHTML = dark ? moon : sun;
    btn.setAttribute("aria-label", dark ? "切换到浅色模式" : "切换到深色模式");
    btn.setAttribute("aria-pressed",dark ? "true" : "false");
    lamp.setAttribute("aria-pressed",dark ? "false" : "true");
    lamp.setAttribute("aria-label",dark ? "打开台灯并切换到浅色模式" : "关闭台灯并切换到深色模式");
    document.dispatchEvent(new CustomEvent("hatari:theme",{detail:{dark:dark}}));
  }

    renderTheme();
    try{ window.localStorage.setItem("hatari.theme.v1",dark ? "dark" : "light"); }catch(err){}
  }

  renderTheme();
  btn.addEventListener("click",toggleTheme);
  lamp.addEventListener("click",function(e){
    if (lamp.getAttribute("data-dragged") === "true") {
      e.preventDefault();
      return;
    }
    toggleTheme();
  });
})();

})();
</script>
