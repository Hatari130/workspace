<script>
(function(){
  var PROJECTS = {
    "map-creator":{
      title:"Map Creator", kicker:"面向 Agent 的城市地图生成", status:"开源 · MIT", progress:100,
      summary:"把城市、地点清单或 POI 数据转换成可复查的 GIS 地图，并进一步生成风格化的城市导览海报。",
      facts:[["角色","产品 + Skill"],["形式","Agent Skill"],["年份","2026"],["重点","城市地图生成"]],
      problem:"制作一张城市导览地图，通常要反复处理地点检索、坐标系转换、地图数据下载、道路与建筑渲染，以及视觉风格统一。",
      system:"Map Creator 把地点解析、GCJ-02 到 WGS84 的坐标对齐、OpenStreetMap GIS 渲染和可选的 GPT Image 风格化组织成一条 Agent 工具链，并保留 POI JSON 供人工复查。",
      next:"继续验证不同城市和地点类型下的解析准确性、OSM 数据请求的稳定性，以及 GIS 草稿到风格化海报之间的可控程度。",
      en:{kicker:"City map generation for agents",status:"Open source · MIT",summary:"Turn cities, place lists, or POI data into reviewable GIS maps, then optionally generate stylized city guide posters.",facts:[["Role","Product + Skill"],["Format","Agent Skill"],["Year","2026"],["Focus","City map generation"]],problem:"Making a city guide map means repeatedly handling place lookup, coordinate conversion, map data, road and building rendering, and visual consistency.",system:"Map Creator organizes place resolution, GCJ-02 to WGS84 alignment, OpenStreetMap GIS rendering, and optional GPT Image stylization into an Agent toolchain, while keeping POI JSON available for human review.",next:"Keep testing resolution accuracy across cities and place types, the reliability of OSM requests, and how much control remains between the GIS draft and the stylized poster."},
      visual:"map"
    },
    "exam-reverse-engineer":{
      title:"Exam Reverse Engineer", kicker:"面向自命题专业课的真题分析 Skill", status:"开源 · GitHub", progress:100,
      summary:"从历年真题中还原出题规律，输出分阶段报告与可执行的复习策略。",
      facts:[["角色","产品 + Skill"],["形式","Agent Skill"],["年份","2026"],["重点","真题研究"]],
      problem:"很多备考分析停留在“哪些知识点出现过”。但连续多年的自命题专业课真题，还包含题型结构、出题措辞、轮换周期和年度变量；如果只做频次统计，就会丢掉这些命题信号。",
      system:"Exam Reverse Engineer 把分析拆成四个阶段：先按年份整理题型、题量与分值，再建立知识点—年份矩阵并识别阶段和轮换周期；随后分析措辞、出题人偏好与外部事件响应，最后输出分级预测、优先级矩阵、时间分配、答题框架和模拟题。",
      next:"继续用不同学科和更长年份跨度验证方法边界，尤其关注样本不连续、题面不完整和反预测行为对结果的影响。",
      repo:"https://github.com/Hatari130/exam-reverse-engineer",
      en:{kicker:"A skill for reverse-engineering self-set exams",status:"Open source · GitHub",summary:"Recover question-setting patterns from past papers and turn them into staged analysis and study strategy.",facts:[["Role","Product + Skill"],["Format","Agent Skill"],["Year","2026"],["Focus","Exam research"]],problem:"Exam preparation often stops at counting which topics appeared. A continuous set of self-set papers also contains structural, wording, rotation, and yearly signals that frequency alone cannot explain.",system:"Exam Reverse Engineer works in four phases: classify each year's question types, counts, and scores; build a topic–year matrix and identify stages and rotation; analyze wording, setter preferences, and responses to external events; then produce tiered predictions, a priority matrix, time allocation, answer frameworks, and mock questions.",next:"Keep testing the method across disciplines and longer time spans, especially where samples are incomplete, question text is noisy, or setters deliberately break historical patterns."},
      visual:"exam"
    },
    "cinema-stars-maps":{
      title:"Cinema Stars Maps", kicker:"每个人的电影史 · 观影数据可视化", status:"已上线 · 在线体验", progress:100,
      summary:"把豆瓣观影记录变成一片可探索、可分享的电影史星空。",
      facts:[["角色","产品 + 网站"],["形式","网站"],["年份","2026"],["重点","观影可视化"]],
      problem:"电影记录通常停留在一张列表里：用户能看到看过什么，却很难感受到自己的观影轨迹、年代和电影之间的关系。",
      system:"后端抓取豆瓣公开观影页，或接收 CSV 备用导入；pipeline 按年份、国别与编辑库完成匹配和分区，再生成星空 JSON 与 SVG 海报。星等和星座是查询结果，不额外落库。",
      next:"继续补全编辑库，改善中文片名与年份的匹配，并在公开部署时把后台任务从轻量起步方案迁移到更稳定的队列与数据库。",
      website:"https://cinema-stars-maps.onrender.com/",
      en:{kicker:"Every cinema · personal film history",status:"Live · try it online",summary:"Turn a personal film diary into an explorable and shareable cinema star map.",facts:[["Role","Product + Website"],["Format","Website"],["Year","2026"],["Focus","Film data visualization"]],problem:"Film records usually stay as a list: people can see what they watched, but not the relationships between their viewing history, eras, regions, and films.",system:"The backend reads a public Douban film diary or accepts a CSV fallback; a pipeline matches and places films by year, country, and editorial lists, then generates star-map JSON and an SVG poster. Ratings and constellations remain query results rather than stored data.",next:"Keep expanding the editorial library, improve Chinese-title and year matching, and move background jobs from the lightweight starting setup to a more durable queue and database for public deployment."},
      visual:"cinema"
    },
  };

  function visual(type){
    if (type === "map") {
      return '<div class="project-shot shot-map"><img class="project-real-image" src="map-creator/changning-industrial-memory-map.jpg" alt="Map Creator 生成的长宁工业记忆打卡地图"></div>';
    }
    if (type === "cinema") {
      return '<div class="project-shot shot-cinema"><img class="project-real-image" src="cinema-stars-maps/cinema-stars-maps-site.png" alt="Cinema Stars Maps 每个人的电影史网站界面"></div>';
    }
    if (type === "exam") {
      return '<div class="project-shot shot-exam"><div class="shot-window"><div class="mock-topbar"><i></i><i></i><i></i><b>exam-reverse-engineer</b></div><div class="exam-mock"><div class="exam-mock-head"><span>PAST PAPERS</span><b>2020—2025</b></div><div class="exam-mock-matrix" aria-hidden="true"><i></i><i class="is-on"></i><i></i><i class="is-hot"></i><i></i><i class="is-on"></i><i class="is-on"></i><i></i><i></i><i></i><i class="is-hot"></i><i></i><i></i><i class="is-hot"></i><i class="is-on"></i><i></i><i></i><i class="is-on"></i></div><div class="exam-mock-flow"><span><b>01</b><em>摄入</em></span><i></i><span><b>02</b><em>结构</em></span><i></i><span><b>03</b><em>画像</em></span><i></i><span><b>04</b><em>策略</em></span></div></div></div></div>';
    }
    return '<div class="project-shot shot-map"><img class="project-real-image" src="map-creator/changning-industrial-memory-map.jpg" alt="Map Creator 生成的长宁工业记忆打卡地图"></div>';
  }

  var slug = new URLSearchParams(window.location.search).get("project") || "map-creator";
  if (slug === "podcast-bridge") {
    window.location.replace("podcast-bridge/index.html");
    return;
  }
  var project = PROJECTS[slug] || PROJECTS["map-creator"];
  document.body.setAttribute("data-project",slug);
  function renderProject(language){
    var copy = language === "en" && project.en ? project.en : project;
    document.title = project.title+" — "+(language === "en" ? "Hatari's AI Workspace" : "Hatari 的 AI 工作台");
    document.getElementById("project-kicker").textContent = copy.kicker;
    document.getElementById("project-title").textContent = project.title;
    document.getElementById("project-summary").textContent = copy.summary;
    document.getElementById("project-status").textContent = copy.status;
    var projectLink = document.getElementById("project-link");
    if (project.website || project.repo) {
      projectLink.href = project.website || project.repo;
      projectLink.textContent = project.website
        ? (language === "en" ? "Open website ↗" : "打开网站 ↗")
        : (language === "en" ? "View repository ↗" : "查看 GitHub 仓库 ↗");
      projectLink.hidden = false;
    } else {
      projectLink.hidden = true;
      projectLink.removeAttribute("href");
      projectLink.textContent = "";
    }
    document.getElementById("project-visual").innerHTML = visual(project.visual);
    document.getElementById("project-problem").textContent = copy.problem;
    document.getElementById("project-system").textContent = copy.system;
    document.getElementById("project-next").textContent = copy.next;
    document.getElementById("project-progress-label").textContent = project.progress+"%";
    document.getElementById("project-progress").style.setProperty("--progress",project.progress+"%");
    document.getElementById("project-facts").innerHTML = copy.facts.map(function(fact){
      return '<div class="detail-fact"><span>'+fact[0]+'</span><b>'+fact[1]+'</b></div>';
    }).join("");
  }
  renderProject(window.HATARI_LANG || "zh");
  document.addEventListener("hatari:languagechange",function(event){
    renderProject(event.detail && event.detail.lang === "en" ? "en" : "zh");
  });
  var btn = document.getElementById("theme");
  var dark = false;
  var sun = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"/></svg>';
  var moon = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></svg>';
  btn.addEventListener("click",function(){
    dark = !dark;
    document.documentElement.classList.toggle("dark",dark);
    btn.innerHTML = dark ? moon : sun;
    btn.setAttribute("aria-label",dark ? "切换到浅色模式" : "切换到深色模式");
  });
})();
</script>
</body>
</html>
